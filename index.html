<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Расчёт резервуаров РВС</title><meta name="description" content="Расчёт вертикальных стальных резервуаров РВС по ГОСТ 31385-2023: стенка, ветер, снег, устойчивость, конструкции, отчёт Word. Версия 2.0.0."><meta name="theme-color" content="#0a0a0a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="РВС 2.0.0"><meta property="og:title" content="Расчёт резервуаров РВС 2.0.0"><meta property="og:description" content="Программа расчёта резервуаров по ГОСТ 31385-2023 — работает в браузере и на телефоне"><meta property="og:image" content="https://1morerus.github.io/rvs-raschet/icon-512.png"><style>
:root{
 --paper:#fafafa;--panel:#ffffff;--tree:#fafafa;--hair:#ebebeb;--ash:#c9c9c9;--graphite:#8f8f8f;--stone:#666666;--char:#4d4d4d;--ink:#171717;--carbon:#000;--green:#297a3a;
 --text:#171717;--mute:#666666;--rule:#ebebeb;--accent:#171717;--fail:#171717;--ok:#297a3a;--warn:#4d4d4d;--inv:#171717;--inv-t:#ffffff;--sel:#f0f0f0;
 --ring:0 0 0 1px rgba(0,0,0,.08),0 0 0 2px #fafafa;--ring2:0 0 0 1px #ebebeb;
 --sans:"Geist","Geist Sans","Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
 --mono:"Geist Mono","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
 --serif:var(--sans);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0a0a0a;--panel:#111111;--tree:#0a0a0a;--hair:#2a2a2a;--ash:#444;--graphite:#8f8f8f;--stone:#a1a1a1;--char:#c7c7c7;--ink:#ededed;--carbon:#fff;--green:#4fb465;--text:#ededed;--mute:#a1a1a1;--rule:#2a2a2a;--accent:#ededed;--fail:#ededed;--ok:#4fb465;--warn:#c7c7c7;--inv:#ededed;--inv-t:#0a0a0a;--sel:#1c1c1c;--ring:0 0 0 1px rgba(255,255,255,.1),0 0 0 2px #0a0a0a;--ring2:0 0 0 1px #2a2a2a;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0a0a0a;--panel:#111111;--tree:#0a0a0a;--hair:#2a2a2a;--stone:#a1a1a1;--char:#c7c7c7;--ink:#ededed;--carbon:#fff;--green:#4fb465;--text:#ededed;--mute:#a1a1a1;--rule:#2a2a2a;--accent:#ededed;--fail:#ededed;--ok:#4fb465;--inv:#ededed;--inv-t:#0a0a0a;--sel:#1c1c1c;--ring:0 0 0 1px rgba(255,255,255,.1),0 0 0 2px #0a0a0a;--ring2:0 0 0 1px #2a2a2a;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{max-width:100vw;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--sans);font-feature-settings:"calt" 0,"rlig","ss11";font-variant-numeric:tabular-nums;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
::selection{background:var(--ink);color:var(--paper)}
/* eyebrow / mono stamp */
.eyebrow,legend,.step dt,.kind,.crumbs,.rn,.frow .meta,.st,.badge,.utag,.fmeta b,.dlg-head b,.kv .lab,footer.status,.bar-apply span,table.grid th,.legend,figcaption,.small,.rng,.unit,.step .num{font-family:var(--mono)}
legend,.step dt,.kind,.crumbs,table.grid th,.dlg-head b,.badge,.st,.utag{font-size:11px;letter-spacing:.071em;text-transform:uppercase;font-weight:400}
/* top nav */
header.top{height:60px;display:flex;align-items:center;gap:8px;padding:0 20px;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--hair);position:relative;z-index:3}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand::before{content:"▲";color:var(--carbon);font-size:20px;line-height:1}
.brand>div{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-weight:500;font-size:14px;letter-spacing:-.01em}
.brand span{font:11px/1.4 var(--mono);letter-spacing:.071em;text-transform:uppercase;color:var(--stone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:0;box-shadow:var(--ring2);background:var(--panel);color:var(--char);border-radius:6px;padding:0 14px;height:32px;cursor:pointer;white-space:nowrap;font-size:14px}
.btn:hover{color:var(--ink);box-shadow:0 0 0 1px var(--ash)}
.btn.primary{background:var(--ink);color:var(--paper);box-shadow:none}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 86%,var(--paper))}
.btn:disabled{opacity:.4;cursor:not-allowed}
#btn-nav{display:none}
.shell{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:0}
main,#view{min-width:0}
/* tree */
aside{background:var(--tree);border-right:1px solid var(--hair);overflow:auto;padding:12px 8px}
aside ul{list-style:none;margin:0;padding:0}
.node{display:flex;align-items:center;padding-left:calc(var(--lvl) * 12px - 10px);border-radius:6px;margin:1px 0}
.node:hover{background:var(--sel)}
.node.sel{background:var(--panel);box-shadow:var(--ring)}
.tw{width:20px;height:28px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer;color:var(--graphite)}
.tw svg{width:11px;height:11px;transition:transform .12s}.tw.open svg{transform:rotate(90deg)}.tw.sp{cursor:default}
.lbl{flex:1;display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:4px 8px 4px 2px;cursor:pointer;font-size:14px;color:var(--char);min-width:0}
.node.sel .lbl{color:var(--ink);font-weight:500}
.lbl svg{width:15px;height:15px;flex:none;color:var(--graphite)}
.lbl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:9999px;margin-left:auto;flex:none}
.dot.ok{background:var(--green)}.dot.fail,.dot.err{background:var(--ink)}.dot.warn{background:transparent;box-shadow:0 0 0 1.5px var(--stone) inset}
/* content */
main{overflow:auto;min-height:0;outline:none}
.crumbs{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--hair);padding:9px 32px;color:var(--stone)}
#view{padding:8px 32px 96px;max-width:1120px}
h1{font-size:30px;line-height:1.1;letter-spacing:-1.5px;font-weight:450;margin:32px 0 16px}
h2{font-size:20px;letter-spacing:-.5px;font-weight:500;margin:40px 0 12px}
h2.jh{font-size:24px;letter-spacing:-1px;font-weight:450;border-top:1px solid var(--ink);padding-top:16px;margin-top:56px}
h2.jh.sub{font-size:18px;border-top-color:var(--hair);margin-top:32px}
p{max-width:75ch;color:var(--char)}
.muted{color:var(--stone)}.small{font-size:12px}
.callout{box-shadow:var(--ring2);background:var(--panel);border-radius:6px;padding:10px 14px;max-width:none;color:var(--char)}
.callout::before{content:"! ";font-family:var(--mono);color:var(--ink)}
fieldset{border:0;box-shadow:var(--ring);border-radius:6px;background:var(--panel);margin:0 0 20px;padding:8px 20px 12px}
legend{color:var(--ink);padding:14px 0 6px;float:left;width:100%;border-bottom:1px solid var(--hair);margin-bottom:4px}
legend+*{clear:both}
input[type=text],input[type=number],select,textarea{background:var(--paper);border:0;box-shadow:var(--ring2);border-radius:6px;padding:6px 10px;min-height:32px;color:var(--ink)}
input[type=text]:focus,select:focus,textarea:focus{box-shadow:0 0 0 1px var(--ink);outline:none;background:var(--panel)}
input::placeholder{color:var(--ash)}
.unit{color:var(--stone);font-size:12px;min-width:3em}
.cb{display:flex;gap:10px;align-items:flex-start;cursor:pointer;color:var(--ink)}
.cb input{margin-top:4px;accent-color:var(--ink)}
/* form */
.frow{display:grid;grid-template-columns:minmax(220px,300px) minmax(200px,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--hair)}
.frow:last-child{border-bottom:0}
.frow>label{color:var(--ink);font-size:14px;padding-top:6px}
.frow.miss>label::before{content:"● ";color:var(--ink);font-size:9px;vertical-align:2px}
.frow .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frow .ctl input[type=text]{min-width:120px;flex:0 1 180px}.frow .ctl select{flex:1 1 280px;min-width:0}
.frow .meta{grid-column:2;display:flex;flex-wrap:wrap;gap:2px 16px;font-size:12px;color:var(--stone)}
.custwrap{grid-column:2;display:flex;flex-direction:column;gap:8px;background:var(--paper);border-radius:6px;padding:10px 12px;box-shadow:var(--ring2)}
.custwrap::before{content:"СВОЁ ЗНАЧЕНИЕ";font:11px var(--mono);letter-spacing:.071em;color:var(--stone)}
.cust{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.cust label{min-width:5em;font-size:14px}.cust input{width:120px}
.rng{font-size:12px;color:var(--stone)}.rng.bad{color:var(--ink);font-weight:600}
.st{border-radius:9999px;padding:2px 8px;white-space:nowrap;font-size:10.5px}
.st.no{background:var(--inv);color:var(--inv-t)}.st.ok{color:var(--green);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--green) 40%,transparent)}.st.usr{color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
input.bad{box-shadow:0 0 0 2px var(--ink)!important}
.bar-apply{position:sticky;top:44px;z-index:1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);box-shadow:var(--ring);border-radius:6px;padding:10px 12px;margin:12px 0 24px}
.bar-apply span{font-size:12px;color:var(--char);margin-right:auto}
.bar-apply.dirty{box-shadow:0 0 0 1px var(--ink)}
.bar-apply.dirty span::before{content:"● ";}
textarea#json{width:100%;font:12px/1.55 var(--mono)}
/* tables */
.tw-wrap{overflow-x:auto;margin:8px 0 20px;border-radius:6px;box-shadow:var(--ring);background:var(--panel)}
table.grid{border-collapse:collapse;width:100%;font-size:14px}
table.grid th,table.grid td{border-bottom:1px solid var(--hair);padding:9px 12px;text-align:left;vertical-align:top}
table.grid tr:last-child td{border-bottom:0}
table.grid th{color:var(--stone);background:var(--paper)}
table.grid td{color:var(--char)}
table.grid td.n{text-align:right;white-space:nowrap;color:var(--ink);font-family:var(--mono);font-size:13px}
td.diff{font-weight:600;text-decoration:underline;text-underline-offset:3px}
/* step card */
.step{background:var(--panel);box-shadow:var(--ring);border-radius:6px;margin:16px 0;padding:14px 20px 16px;position:relative}
.step:has(.chk.no){box-shadow:0 0 0 1px var(--ink)}
.step:has(.chk.no)::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ink);border-radius:6px 0 0 6px}
.step header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--hair)}
.step .num{font-size:12px;color:var(--stone);min-width:3.4em}
.step h3{margin:0;font-size:16px;font-weight:500;letter-spacing:-.2px;flex:1}
.kind{color:var(--stone);border-radius:9999px;padding:1px 8px;box-shadow:var(--ring2)}
.kind.k-user{color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.step dl{display:grid;grid-template-columns:130px 1fr;gap:8px 16px;margin:12px 0 0}
.step dt{color:var(--graphite);padding-top:3px}
.step dd{margin:0;color:var(--char)}
.formula{font-size:17px;color:var(--ink);letter-spacing:-.1px}
.fbtn{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;text-decoration:underline dotted var(--ash);text-underline-offset:5px}
.fbtn:hover{text-decoration-color:var(--ink)}
.fbtn::after{content:" ↗";font:12px var(--mono);color:var(--graphite)}
.sub,.conv{font-size:16px;color:var(--ink);overflow-wrap:anywhere;line-height:1.9}
.conv{font-size:14px;color:var(--char)}
.result{font-size:15px}
.srcd{font-size:13.5px}
.chk{font-family:var(--mono);font-size:13px}
.chk.ok{color:var(--green)}.chk.ok::before{content:"✓ "}
.chk.no{color:var(--inv-t);background:var(--inv);border-radius:6px;padding:4px 8px;display:inline-block}.chk.no::before{content:"✕ "}
.chk.info{color:var(--char)}.chk.info::before{content:"! "}
.note{font-size:13px;color:var(--stone)}
sub,sup{font-size:.72em;line-height:0}
/* tokens */
.tk{display:inline-flex;align-items:center;gap:1px;font-family:var(--mono);font-size:.9em;border-radius:4px;padding:0 1px;line-height:1.5}
.tk.s-input{box-shadow:inset 0 -1px 0 var(--ink)}
.tk.s-norm{box-shadow:inset 0 -1px 0 var(--ink);background-image:linear-gradient(90deg,var(--ink) 50%,transparent 50%);background-size:4px 1px;background-repeat:repeat-x;background-position:0 100%;box-shadow:none}
.tk.s-calc{box-shadow:none}
.tk.s-custom{box-shadow:inset 0 0 0 1px var(--ink)}
.tk.usr{background:var(--inv);color:var(--inv-t);box-shadow:none}
.tk.out{outline:1px dashed var(--ink);outline-offset:1px}
.tok{font:inherit;border:0;background:transparent;color:inherit;padding:0 2px;text-align:center;min-width:2.5ch;border-radius:4px}
.tok:hover{background:var(--sel)}.tk.usr .tok:hover{background:transparent}
.tok:focus{background:var(--panel);color:var(--ink);outline:none;box-shadow:0 0 0 1px var(--ink)}
.rst{border:0;background:var(--inv-t);color:var(--inv);border-radius:4px;cursor:pointer;font:11px var(--mono);padding:0 5px;margin-left:3px;line-height:1.6}
.tk:not(.usr) .rst,.grid .rst{background:var(--inv);color:var(--inv-t)}
.ref{border:0;background:none;color:var(--ink);text-decoration:underline;text-decoration-color:var(--ash);text-underline-offset:3px;cursor:pointer;padding:0;font:inherit}
.ref:hover{text-decoration-color:var(--ink)}
.ref.nf{text-decoration-style:wavy}
.rl{display:inline-flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;color:var(--ink)}
.rl b{font-family:var(--mono);font-weight:600}
.rn{font-size:11px;color:var(--graphite)}
.utag{border-radius:9999px;padding:1px 8px;background:var(--inv);color:var(--inv-t);font-size:10px}
.legend{background:var(--panel);box-shadow:var(--ring);border-radius:6px;padding:10px 14px;max-width:none;color:var(--char);line-height:2}
.legend .tk{margin-right:6px}
/* panels */
.errors{box-shadow:0 0 0 1px var(--ink);background:var(--panel);border-radius:6px;padding:12px 16px;margin:16px 0}
.errors h2{margin:0 0 6px;font-size:16px;font-weight:500}.errors h2::before{content:"✕ ";font-family:var(--mono)}
.errors table{border-collapse:collapse;width:100%;font-size:13.5px}.errors td,.errors th{border-top:1px solid var(--hair);padding:6px;text-align:left;vertical-align:top}
.warns{box-shadow:var(--ring);background:var(--panel);border-radius:6px;padding:10px 14px;margin:12px 0}
.warns summary{cursor:pointer;font:12px var(--mono);letter-spacing:.071em;text-transform:uppercase;color:var(--char)}
.warns li{margin:6px 0;font-size:13.5px;color:var(--char)}
figure.chart{margin:16px 0 24px;background:var(--panel);box-shadow:var(--ring);border-radius:6px;padding:16px;overflow-x:auto}
figure.chart svg{max-width:100%;height:auto;display:block}
figcaption{font-size:12px;color:var(--stone);margin-top:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:9999px;white-space:nowrap;font-size:10.5px}
.badge.ok{color:var(--green);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--green) 40%,transparent)}.badge.ok::before{content:"✓ "}
.badge.no{background:var(--inv);color:var(--inv-t)}.badge.no::before{content:"✕ "}
.badge.info{color:var(--char);box-shadow:var(--ring2)}.badge.info::before{content:"! "}
tr.bad td{background:var(--sel)}
.bar{position:relative;height:4px;background:var(--hair);border-radius:9999px;min-width:110px;margin:8px 0 4px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:9999px}
.bar b{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--graphite)}
.verdict{font-size:22px;letter-spacing:-.6px;font-weight:450;padding:18px 20px;border-radius:6px;max-width:none;box-shadow:var(--ring);background:var(--panel);color:var(--ink)}
.verdict.ok::before{content:"✓ ";color:var(--green)}
.verdict.no{background:var(--inv);color:var(--inv-t);box-shadow:none}.verdict.no::before{content:"✕ "}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:16px 0}
.kv div{background:var(--panel);box-shadow:var(--ring);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kv .rl{display:block;color:var(--stone);font-size:13px}.kv .rl b{display:block;margin:2px 0;font-size:26px;letter-spacing:-.9px;font-family:var(--sans);font-weight:450;color:var(--ink)}.kv .rl .rn,.kv .rl .utag{display:inline-block;margin:2px 4px 0 0}
.kv a{font:11px var(--mono);letter-spacing:.071em;text-transform:uppercase;color:var(--stone)}
.concl li{margin:6px 0;color:var(--char)}.concl li.no{color:var(--ink);font-weight:600}
.issues li{margin:8px 0;max-width:85ch;color:var(--char)}
.ov{padding-left:0;list-style:none}.ov li{margin:0;border-bottom:1px solid var(--hair)}.ov li .lnk{display:block;padding:10px 0;text-decoration:none;color:var(--ink)}.ov li .lnk::before{content:"▲ ";font-size:10px;vertical-align:1px}
.lnk{border:0;background:none;color:var(--ink);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;font:inherit}
/* status bar = CLI panel */
footer.status{display:flex;gap:24px;flex-wrap:wrap;align-items:center;padding:8px 20px;border-top:1px solid var(--hair);background:var(--panel);font-size:12px;color:var(--char)}
footer.status span::before{content:"▲ ";color:var(--carbon);font-size:9px;vertical-align:1px}
footer.status .okk::before{content:"✓ ";color:var(--green);font-size:12px}
footer.status b{color:var(--ink);font-weight:600}
footer.status.err{background:var(--inv);color:var(--inv-t)}footer.status.err .lnk,footer.status.err b{color:var(--inv-t)}
.status b.f{background:var(--inv);color:var(--inv-t);padding:0 5px;border-radius:4px}
.uflag{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--inv);color:var(--inv-t);padding:10px 16px;border-radius:6px;max-width:90vw;transition:.18s;pointer-events:none;z-index:10;font:13px var(--mono)}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad::before{content:"✕ "}
/* dialog */
dialog#dlg{width:min(1000px,96vw);max-height:92vh;border:0;border-radius:6px;padding:0;background:var(--panel);color:var(--ink);box-shadow:var(--ring)}
dialog#dlg::backdrop{background:color-mix(in srgb,var(--paper) 70%,transparent);backdrop-filter:blur(6px)}
.dlg-head{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--hair);z-index:2}
.dlg-head b::before{content:"▲ ";color:var(--carbon)}
#dlg-body{padding:8px 20px 20px;overflow:auto;max-height:calc(92vh - 54px)}
#dlg-body h2{margin-top:14px;font-size:22px;letter-spacing:-.8px;font-weight:450}
.fmeta{font-size:12.5px;max-width:none;color:var(--char);font-family:var(--mono);background:var(--paper);box-shadow:var(--ring2);border-radius:6px;padding:10px 12px}
.fmeta b{color:var(--stone);font-weight:400;font-size:11px;letter-spacing:.071em;text-transform:uppercase}
.fr-wrap{position:relative;border-radius:6px;overflow:hidden;box-shadow:var(--ring);background:#fff}
.fr-wrap img{display:block;width:100%;height:auto}
.fr-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.ftext{white-space:pre-wrap;background:var(--paper);box-shadow:var(--ring2);border-radius:6px;padding:14px;font:12.5px/1.6 var(--mono);max-height:60vh;overflow:auto}

/* v3: сводки, карточки расчётов */

    R('ring2', 'Изоляция и конструкции', 'Высота нижнего кольца жёсткости от днища', 'z_{к2}', 'м', 'num', 2.4, 'высота нижнего кольца жёсткости', 'КМ л. 5, разрез А-А: узел Е на отметке 2400 мм. Учитывается в оценке устойчивости по участкам', LK('km5-AA', 'КМ, л. 5, разрез А-А')),
    R('Rsph', 'Изоляция и конструкции', 'Радиус сферы крыши', 'R_{кр}', 'м', 'num', 50, 'радиус сферы крыши', 'R50000', LK('km4-view', 'КМ, л. 8')),
    R('Mw', 'Изоляция и конструкции', 'Масса стенки', 'M_{ст}', 'т', 'num', 112.089, 'масса стенки', '', LK('km4-mass', 'КМ, л. 4')),
    R('Mring', 'Изоляция и конструкции', 'Масса кольца жёсткости', 'M_{к}', 'т', 'num', 1.74, 'масса кольца жёсткости', '', LK('km4-mass', 'КМ, л. 4')),
    R('Mlad', 'Изоляция и конструкции', 'Масса шахтной лестницы', 'M_{л}', 'т', 'num', 3.74, 'масса шахтной лестницы', '', LK('km4-mass', 'КМ, л. 4')),
    R('Mhat', 'Изоляция и конструкции', 'Масса люков и патрубков', 'M_{лп}', 'т', 'num', 2.83, 'масса люков и патрубков', '', LK('km4-mass', 'КМ, л. 4')),
    R('Mknp', 'Изоляция и конструкции', 'Масса площадок КНП-10', 'M_{кнп}', 'т', 'num', 3.25, 'масса площадок КНП-10', '', LK('km4-mass', 'КМ, л. 4')),
    R('Mroof', 'Изоляция и конструкции', 'Масса крыши', 'M_{кр}', 'т', 'num', 87.245, 'масса крыши', '', LK('km4-mass', 'КМ, л. 4')),
    R('Mplat', 'Изоляция и конструкции', 'Масса площадок и ограждения на крыше', 'M_{пл}', 'т', 'num', 10.654, 'масса площадок и ограждения на крыше', '', LK('km4-mass', 'КМ, л. 4'))
  ];
  const FMAP = {}; FIELDS.forEach(f => FMAP[f.k] = f);
  const emptyV = () => { const v = {}; FIELDS.forEach(f => { v[f.k] = (f.t === 'str' || f.t === 'sel') ? '' : null; }); v.n = null; return v; };
  const exampleV = () => { const v = {}; FIELDS.forEach(f => { v[f.k] = f.ex === undefined ? (f.t === 'str' || f.t === 'sel' ? '' : null) : f.ex; }); return v; };
  const emptyDraft = () => ({ v: emptyV(), cv: {}, ov: {} });
  const exampleDraft = () => ({ v: exampleV(), cv: {}, ov: {} });
  const autoPreview = (k, v) => { const f = AUTO[k]; if (!f) return undefined; try { const x = f(key => v[key]); return isNum(x) ? x : undefined; } catch (e) { return undefined; } };

  /* ---------- расчёт ---------- */
  function run(draft) {
    const I = Object.assign({}, draft.v), cv = draft.cv || {}, ov = draft.ov || {};
    const res = { ok: false, errors: [], warnings: [], steps: [], Q: {}, V: {}, checks: [], missing: [], stamp: new Date().toISOString(), draft: clone({ v: I, cv, ov }) };
    const E = res.errors, Q = res.Q;
    const err = (param, reason, rule, fix) => E.push({ param, reason, rule, fix });
    for (const f of FIELDS) {
      if (['object', 'place', 'author'].includes(f.k)) continue;
      if (f.t === 'num' || f.t === 'assume') { if (!isNum(I[f.k])) { res.missing.push(f.l); err(f.l, 'не задано', f.ref ? f.ref.replace(/⟪[^|]*\|([^|]*)\|⟫/, '$1') : 'исходные данные', 'Введите значение'); } }
      else if (f.t === 'sel' && !I[f.k]) { res.missing.push(f.l); err(f.l, 'не задано', f.ref ? f.ref.replace(/⟪[^|]*\|([^|]*)\|⟫/, '$1') : 'исходные данные', 'Выберите вариант'); }
      else if (f.t === 'str' && f.k === 'thick' && !String(I.thick || '').trim()) { res.missing.push(f.l); err(f.l, 'не задано', 'КМ, л. 5', 'Введите толщины поясов'); }
    }
    if (E.length) return res;
    const nB = Math.round(I.n);
    if (nB < 1 || nB > 40) { err('Количество поясов', 'вне допустимого диапазона 1…40', 'исходные данные', 'Исправьте число поясов'); return res; }
    let tn; try { tn = parseThick(I.thick, nB); } catch (e) { err('Толщины поясов', e.message, 'КМ, л. 5', 'Введите одно число или список из ' + nB + ' чисел'); return res; }
    const META = (k) => FMAP[k] || {};
    const q = (k, calc, o) => {
      o = o || {}; const m = META(k), u = isNum(ov[k]);
      const it = { k, v: u ? ov[k] : calc, calc, u: o.u !== undefined ? o.u : (m.u || ''), d: o.d !== undefined ? o.d : (m.d !== undefined ? m.d : 3), s: o.s || m.s || k, n: o.n || m.n || '', src: o.src || 'calc', user: u, tbl: o.tbl, grp: o.grp };
      Q[k] = it; return it.v;
    };
    const inp = (k, o) => q(k, I[k], Object.assign({ src: META(k).t === 'assume' ? 'assume' : 'input' }, o));
    const get = key => (Q[key] ? Q[key].v : I[key]);
    const nq = (k, o) => {
      const tbl = AUTO[k](get);
      if (isNum(cv[k])) return q(k, cv[k], Object.assign({ src: 'custom', tbl }, o));
      if (!isNum(tbl)) { err(META(k).l, 'не удалось определить по таблице', META(k).hint, 'Задайте своё значение или исправьте исходные данные'); return NaN; }
      return q(k, tbl, Object.assign({ src: 'norm', tbl }, o));
    };

    /* --- величины --- */
    const D = inp('D'), Hst = inp('Hst'), h = inp('hi'), hk = inp('hk'), V = inp('V'), nn = q('n', nB, { src: 'input', d: 0 });
    const r = q('r', D / 2, { u: 'м', d: 3, s: 'r', n: 'радиус резервуара' });
    const pPa = inp('p'), pM = q('pM', pPa / 1e6, { u: 'МПа', d: 6, s: 'p', n: 'нормативное избыточное давление, МПа' });
    const rhod = nq('rhod'), g = nq('g'), rhogK = nq('rhog'), rg = q('rg', rhogK / 1000, { u: 'т/м³', d: 3, s: 'ρ_{g}', n: 'плотность воды, т/м³' });
    const Hd = inp('H'), Hg = inp('Hg'), dtc = inp('dtc'), dtm = inp('dtm'), Tm = inp('Tmax'), Tt = inp('T');
    const Ryn = nq('Ryn'), gm = nq('gm'), gn = nq('gn'), gt = nq('gt');
    const gc1 = nq('gc1'), gc2 = nq('gc2'), gc3 = nq('gc3'), gcg = nq('gcg'), th = nq('th');
    const ts = []; for (let i = 1; i <= nB; i++) ts.push(q('t' + i, tn[i - 1], { src: 'input', u: 'мм', d: 2, s: 't_{' + i + '}', n: 'принятая номинальная толщина пояса ' + i }));
    if (E.length) return res;
    const belts = [];
    for (let i = 1; i <= nB; i++) {
      const z = q('z' + i, (i - 1) * h, { u: 'м', d: 3, s: 'z_{' + i + '}', n: 'расстояние от днища до нижней кромки пояса ' + i });
      const t = ts[i - 1], gc = i === 1 ? gc1 : i === 2 ? gc2 : gc3;
      const Rd = q('Rd' + i, Ryn * gc * gt / (gm * gn), { u: 'МПа', d: 2, s: 'R_{' + i + '}^{э}', n: 'расчётное сопротивление, эксплуатация, пояс ' + i });
      const Rg = q('Rg' + i, Ryn * gcg * gt / (gm * gn), { u: 'МПа', d: 2, s: 'R_{' + i + '}^{г}', n: 'расчётное сопротивление, гидроиспытания, пояс ' + i });
      const x = i === 1 ? q('x1', 0, { u: 'м', d: 3, s: 'x_{1}', n: 'уровень максимальных кольцевых напряжений, пояс 1' })
        : q('x' + i, D > 61 ? z + Math.sqrt(r * (Q['t' + (i - 1)].v - dtc - dtm) / 1000) : z, { u: 'м', d: 3, s: 'x_{' + i + '}', n: 'уровень максимальных кольцевых напряжений, пояс ' + i });
      const td = q('td' + i, tdOf(rhod, g, Hd, x, pM, r, Rd, 1.2), { u: 'мм', d: 2, s: 't_{d' + i + '}', n: 'расчётная толщина пояса ' + i + ' в эксплуатации' });
      const tg = q('tg' + i, tdOf(rg, g, Hg, x, pM, r, Rg, 1.25), { u: 'мм', d: 2, s: 't_{g' + i + '}', n: 'расчётная толщина пояса ' + i + ' при гидроиспытаниях' });
      const tr = q('tr' + i, Math.max(td + dtc, tg, th) + dtm, { u: 'мм', d: 2, s: 't_{треб,' + i + '}', n: 'требуемая номинальная толщина пояса ' + i });
      const mg = q('mg' + i, t - tr, { u: 'мм', d: 2, s: 'Δ_{' + i + '}', n: 'запас по толщине пояса ' + i });
      const Hdm = q('Hdm' + i, x + ((t - dtc - dtm) / 1000 * Rd / r - 1.2 * pM) / (0.001 * rhod * g), { u: 'м', d: 2, s: 'H_{d,max,' + i + '}', n: 'допустимый уровень продукта по поясу ' + i });
      const Hgm = q('Hgm' + i, x + ((t - dtm) / 1000 * Rg / r - 1.25 * pM) / (0.001 * rg * g), { u: 'м', d: 2, s: 'H_{g,max,' + i + '}', n: 'допустимый уровень воды по поясу ' + i });
      belts.push({ i, z, zt: i * h, x, t, gc, Rd, Rg, td, tg, treq: tr, margin: mg, ok: t >= tr - 1e-9, Hdmax: Hdm, Hgmax: Hgm, teff: t - dtc - dtm, okD: t >= td + dtc + dtm - 1e-9, okG: t >= tg + dtm - 1e-9 });
    }
    // нагрузки
    const ze = q('ze', Hst + hk, { u: 'м', d: 3, s: 'z_{e}', n: 'эквивалентная высота для ветра' });
    const [k10v, z10v, alv] = N.terrain[I.ter];
    const k10 = q('k10', k10v, { src: 'norm', d: 2, s: 'k_{10}', n: 'коэффициент k на высоте 10 м' }), z10 = q('z10', z10v, { src: 'norm', d: 2, s: 'ζ_{10}', n: 'коэффициент пульсации на высоте 10 м' }), al = q('al', alv, { src: 'norm', d: 2, s: 'α', n: 'показатель степени типа местности' });
    const kz = q('kz', k10 * Math.pow(ze / 10, 2 * al), { d: 4, s: 'k(z_{e})', n: 'коэффициент изменения ветрового давления по высоте' });
    const zz = q('zz', z10 * Math.pow(ze / 10, -al), { d: 4, s: 'ζ(z_{e})', n: 'коэффициент пульсации давления ветра' });
    const nu = nq('nu', { d: 4 });
    const w0 = nq('w0'), C = inp('C');
    const wm = q('wm', w0 * kz * C, { u: 'кПа', d: 4, s: 'w_{m}', n: 'средняя составляющая ветровой нагрузки' });
    const wp = q('wp', wm * zz * nu, { u: 'кПа', d: 4, s: 'w_{p}', n: 'пульсационная составляющая ветровой нагрузки' });
    const wn = q('wn', wm + wp, { u: 'кПа', d: 4, s: 'w', n: 'нормативная ветровая нагрузка' });
    const gfw = inp('gfw'), wd = q('wd', wn * gfw, { u: 'кПа', d: 4, s: 'w_{р}', n: 'расчётная ветровая нагрузка' });
    const Sg = nq('Sg'), mu = inp('mu'), ps = q('ps', Sg * mu, { u: 'кПа', d: 3, s: 'p_{s}', n: 'расчётная снеговая нагрузка на крышу' });
    const Mw = inp('Mw'), Mring = inp('Mring'), Mlad = inp('Mlad'), Mhat = inp('Mhat'), Mknp = inp('Mknp'), Mroof = inp('Mroof'), Mplat = inp('Mplat');
    const Gst = q('Gst', Mw + Mring + Mlad + Mhat + Mknp, { u: 'т', d: 3, s: 'G_{ст}', n: 'масса стенки с навесными элементами' });
    const Gkr = q('Gkr', Mroof + Mplat, { u: 'т', d: 3, s: 'G_{кр}', n: 'масса крыши с площадками' });
    const Rsph = inp('Rsph'), Akr = q('Akr', 2 * Math.PI * Rsph * hk, { u: 'м²', d: 2, s: 'A_{кр}', n: 'площадь сферической крыши' });
    const insR = nq('ins_r'), insT = inp('ins_t');
    const Gir = q('Gir', Akr * (insT / 1000) * insR / 1000, { u: 'т', d: 3, s: 'G_{из.кр}', n: 'масса изоляции крыши' });
    const Giw = q('Giw', Math.PI * D * Hst * (insT / 1000) * insR / 1000, { u: 'т', d: 3, s: 'G_{из.ст}', n: 'масса изоляции стенки' });
    const Ar = q('Ar', Math.PI * r * r, { u: 'м²', d: 2, s: 'A', n: 'площадь резервуара в плане' });
    const zr = inp('ring'), phi = q('phi', Math.max(0, (Hst - zr) / Hst), { d: 4, s: 'φ', n: 'доля стенки выше кольца жёсткости' });
    const pv = inp('pv'), psi = inp('psi'), gfv = inp('gfv'), gfm = inp('gfm'), gfi = inp('gfi');
    const wv = q('wv', psi * gfv * pv / 1000, { u: 'кПа', d: 4, s: 'q_{v}', n: 'расчётная вакуумная нагрузка с учётом ψ' });
    const N0 = q('N0', (gfm * (Gkr + Gst) + gfi * (Gir + Giw)) * g + ps * Ar + wv * Ar, { u: 'кН', d: 1, s: 'N_{0}', n: 'вертикальная сила в основании стенки' });
    const N1 = q('N1', (gfm * (Gkr + Gst * phi) + gfi * (Gir + Giw * phi)) * g + ps * Ar + wv * Ar, { u: 'кН', d: 1, s: 'N_{к}', n: 'вертикальная сила на уровне кольца жёсткости' });
    const M0 = q('M0', psi * wd * D * Hst * Hst / 2, { u: 'кН·м', d: 1, s: 'M_{0}', n: 'опрокидывающий момент ветра в основании' });
    const M1 = q('M1', psi * wd * D * Math.pow(Math.max(Hst - zr, 0), 2) / 2, { u: 'кН·м', d: 1, s: 'M_{к}', n: 'опрокидывающий момент ветра на уровне кольца' });
    // устойчивость
    const tmin = q('tmin', Math.min(...belts.map(b => b.teff)), { u: 'мм', d: 2, s: 't_{min}', n: 'толщина самого тонкого пояса за вычетом Δt_{c} и Δt_{m}' });
    const f0 = belts.map(b => h * Math.pow(tmin / b.teff, 2.5)), f1 = belts.map(b => Math.max(0, Math.min(h, b.zt - zr)) * Math.pow(tmin / b.teff, 2.5));
    const Hr0 = q('Hr0', f0.reduce((a, b) => a + b, 0), { u: 'м', d: 3, s: 'H_{r}', n: 'редуцированная высота стенки (без кольца)' });
    const Hr1 = q('Hr1', f1.reduce((a, b) => a + b, 0), { u: 'м', d: 3, s: 'H_{r,к}', n: 'редуцированная высота стенки выше кольца' });
    const dl = q('dl', r * 1000 / tmin, { d: 1, s: 'δ', n: 'гибкость стенки' });
    const E_ = nq('E');
    const c0f = x => x < 400 ? null : x < 1220 ? 0.04 + 40 / x : x < 2500 ? 0.085 - 1e-5 * x : x < 5000 ? 0.065 - 2e-6 * x : null;
    const c0v = c0f(dl);
    const stab = {};
    if (c0v === null) { res.warnings.push('δ = ' + fmt(dl, 1) + ' вне диапазона 400…5000 ф. (11): проверка устойчивости не выполнена.'); stab.skip = true; }
    else {
      const C0 = q('C0', c0v, { d: 5, s: 'C_{0}', n: 'коэффициент критического напряжения' });
      const scr1 = q('scr1', C0 * E_ / dl, { u: 'МПа', d: 3, s: 'σ_{cr1}', n: 'критическое меридиональное напряжение' });
      const t = tmin / 1000;
      const variant = (sfx, Hr, Nk, Mk, lbl) => {
        const scr2 = q('scr2' + sfx, 0.55 * r / Hr * E_ / Math.pow(dl, 1.5), { u: 'МПа', d: 3, s: 'σ_{cr2' + lbl + '}', n: 'критическое кольцевое напряжение' + (lbl ? ' (с кольцом)' : '') });
        const s1 = q('s1' + sfx, (Nk / (2 * Math.PI * r * t) + Mk / (Math.PI * r * r * t)) / 1000, { u: 'МПа', d: 3, s: 'σ_{1' + lbl + '}', n: 'меридиональное сжимающее напряжение' + (lbl ? ' (с кольцом)' : '') });
        const s2 = q('s2' + sfx, (wv + 0.5 * psi * wd) * r / t / 1000, { u: 'МПа', d: 3, s: 'σ_{2' + lbl + '}', n: 'кольцевое сжимающее напряжение' + (lbl ? ' (с кольцом)' : '') });
        const ratio = q('ratio' + sfx, s1 / scr1 + s2 / scr2, { d: 3, s: 'K' + (lbl ? '_{к}' : ''), n: 'левая часть условия (9)' + (lbl ? ' (с кольцом)' : '') });
        return { Hr, scr2, s1, s2, ratio, ok: ratio <= 1, N: Nk, M: Mk };
      };
      stab.C0 = C0; stab.scr1 = scr1;
      stab.noring = variant('0', Hr0, N0, M0, ''); stab.ring = Hr1 > 0 ? variant('1', Hr1, N1, M1, 'к') : null;
    }
    if (E.length) return res;
    res.V = { belts, stab, tmin, dl, Hr0, Hr1, loads: { ze, kz, zz, nu, wm, wp, wn, wd, ps, N0, N1, M0, M1, Gst, Gkr, Akr, Gir, Giw, Ar, phi } };

    /* ---------- журнал ---------- */
    const add = (grp, id, o) => res.steps.push(Object.assign({ grp, id, conv: [] }, o));
    const GOST = 'ГОСТ 31385-2023';
    add('prep', 'p1', { title: 'Радиус резервуара', kind: 'calc', f: 'r = D / 2', src: LK('km4-view', 'КМ, л. 4') + ' (внутренний диаметр ⌀34 200 мм)', sub: `r = ${T('D')} / 2`, out: ['r'] });
    add('prep', 'p2', { title: 'Избыточное давление в МПа', kind: 'calc', f: 'p = p_{Па} / 10^{6}', src: LK('km2-II', 'КМ, л. 2, п. 3') + '; ' + LK('g-f56', GOST + ', п. 6.1.4.3'), sub: `p = ${T('p')} / 10^{6}`, out: ['pM'], note: 'В формулах (4) давление p берётся в МПа.' });
    add('prep', 'p3', { title: 'Плотность воды в т/м³', kind: 'calc', f: 'ρ_{g} = ρ_{в} / 1000', src: LK('km3-VI', 'КМ, л. 3, разд. VI'), sub: `ρ_{g} = ${T('rhog')} / 1000`, out: ['rg'] });
    add('prep', 'p4', { title: 'Плотность продукта и ускорение свободного падения', kind: 'norm', f: 'ρ_{d}, g', src: LK('km2-II', 'КМ, л. 2, п. 2') + '; ' + LK('g-f56', GOST + ', п. 6.1.4.3'), sub: `продукт «${I.prod}»: ρ_{d} = ${T('rhod')} т/м³; g = ${T('g')} м/с²`, out: ['rhod', 'g'] });

    add('mat', 'm1', { title: 'Нормативное сопротивление стали', kind: 'mat', f: 'R_{yn} = σ_{т}  (класс прочности)', src: LK('km2-III', 'КМ, л. 2, разд. III') + '; ' + LK('g-f7', GOST + ', п. 6.1.4.4'), sub: `сталь ${I.steel}-14, класс ${I.klass} (прокат ${N.steelClass[I.klass] || 'по сертификату'}): R_{yn} = ${T('Ryn')} МПа`, out: ['Ryn'] });
    add('mat', 'm2', { title: 'Коэффициент надёжности по материалу', kind: 'norm', f: 'γ_{m}', src: LK('g-f7', GOST + ', ф. (7)') + '; СП 16.13330.2017, табл. 3 (файл не приложен)', sub: `γ_{m} = ${T('gm')}`, out: ['gm'], note: 'Значение принято по СП 16.13330.2017 для проката по ГОСТ 19281 — подтвердить.' });
    add('mat', 'm3', { title: 'Коэффициент надёжности по ответственности', kind: 'norm', f: 'γ_{n} — по классу резервуара и плотности продукта', src: LK('g-t4', GOST + ', табл. 4'), sub: `класс ${I.cls}; ρ_{d} = ${T('rhod')} т/м³ ${rhod > 1.05 ? '>' : '≤'} 1,05 → γ_{n} = ${T('gn')}`, out: ['gn'] });
    add('mat', 'm4', { title: 'Температурный коэффициент', kind: 'norm', f: 'γ_{t} = 1  при T ≤ 100 °C', src: LK('g-f8', GOST + ', ф. (8)'), sub: `t_{max} = ${T('Tmax')} °C ${Tm > 100 ? '> 100 °C: γ_{t} = σ_{T}/σ_{T,20} (своё значение)' : '≤ 100 °C → γ_{t} = ' + T('gt')}`, out: ['gt'] });
    add('mat', 'm5', { title: 'Коэффициенты условий работы поясов', kind: 'norm', f: 'γ_{c1}, γ_{c2}, γ_{c3}, γ_{c,г}', src: LK('g-t5', GOST + ', табл. 5'), sub: `D = ${T('D')} м ${D > 61 ? '>' : '≤'} 61 м: γ_{c1} = ${T('gc1')}; γ_{c2} = ${T('gc2')}; γ_{c3} = ${T('gc3')}; γ_{c,г} = ${T('gcg')}`, out: ['gc1', 'gc2', 'gc3', 'gcg'] });
    add('mat', 'm6', { title: 'Минимальная конструктивная толщина листов стенки', kind: 'norm', f: 't_{h} — по диаметру резервуара', src: LK('g-t3', GOST + ', табл. 3'), sub: `D = ${T('D')} м → t_{h} = ${T('th')} мм`, out: ['th'] });

    belts.forEach(b => {
      const i = b.i, gck = i === 1 ? 'gc1' : i === 2 ? 'gc2' : 'gc3', grp = 'b' + i;
      add(grp, 'b' + i + 'a', { title: `Пояс ${i}: расчётное сопротивление R`, kind: 'calc', f: 'R = R_{yn}·γ_{c}·γ_{t} / (γ_{m}·γ_{n})', src: LK('g-f7', GOST + ', ф. (7)'),
        sub: `R_{${i}}^{э} = ${T('Ryn')}·${T(gck)}·${T('gt')} / (${T('gm')}·${T('gn')});\nR_{${i}}^{г} = ${T('Ryn')}·${T('gcg')}·${T('gt')} / (${T('gm')}·${T('gn')})`, out: ['Rd' + i, 'Rg' + i] });
      add(grp, 'b' + i + 'b', i === 1 ? { title: 'Пояс 1: уровень максимальных кольцевых напряжений', kind: 'calc', f: 'x_{1} = 0  (нижний пояс)', src: LK('g-f56', GOST + ', ф. (6)'), sub: `x_{1} = ${T('x1')} м`, out: ['x1'] }
        : D > 61 ? { title: `Пояс ${i}: уровень максимальных кольцевых напряжений`, kind: 'calc', f: 'x_{i} = z_{i} + √( r·(t_{i−1} − Δt_{c} − Δt_{m}) )', src: LK('g-f56', GOST + ', ф. (6)'), conv: [`z_{${i}} = ${T('z' + i)} м;  t_{${i - 1}} в метрах: (t_{${i - 1}} − Δt_{c} − Δt_{m}) / 1000`], sub: `x_{${i}} = ${T('z' + i)} + √( ${T('r')}·(${T('t' + (i - 1))} − ${T('dtc')} − ${T('dtm')}) / 1000 )`, out: ['x' + i] }
          : { title: `Пояс ${i}: уровень максимальных кольцевых напряжений`, kind: 'calc', f: 'x_{i} = z_{i} = (i − 1)·h  (D ≤ 61 м)', src: LK('g-f4', GOST + ', ф. (4): z_{i}') + '; ' + LK('km5-AA', 'КМ, л. 5'), sub: `z_{${i}} = ${i - 1}·${T('hi')} = ${T('z' + i)} м;  x_{${i}} = z_{${i}}`, out: ['z' + i, 'x' + i] });
      add(grp, 'b' + i + 'c', { title: `Пояс ${i}: расчётные толщины t_{d} и t_{g}`, kind: 'calc', f: 't_{d} = [0,001·ρ_{d}·g·(H_{d} − x_{i}) + 1,2·p]·r / R;   t_{g} = [0,001·ρ_{g}·g·(H_{g} − x_{i}) + 1,25·p]·r / R', src: LK('g-f4', GOST + ', ф. (4)') + (D > 61 ? '; ' + LK('g-f56', 'ф. (5)') : ''),
        conv: ['Давление в МПа, уровни и радиус в м → толщина получается в м; ×1000 → мм'],
        sub: `t_{d${i}} = [0,001·${T('rhod')}·${T('g')}·(${T('H')} − ${T('x' + i)}) + 1,2·${T('pM')}]·${T('r')} / ${T('Rd' + i)}·1000;\nt_{g${i}} = [0,001·${T('rg')}·${T('g')}·(${T('Hg')} − ${T('x' + i)}) + 1,25·${T('pM')}]·${T('r')} / ${T('Rg' + i)}·1000`, out: ['td' + i, 'tg' + i] });
      add(grp, 'b' + i + 'd', { title: `Пояс ${i}: требуемая толщина и проверка`, kind: 'chk', f: 't ≥ max(t_{d} + Δt_{c}; t_{g}; t_{h}) + Δt_{m}', src: LK('g-f3', GOST + ', ф. (3)'),
        sub: `t_{треб,${i}} = max(${T('td' + i)} + ${T('dtc')}; ${T('tg' + i)}; ${T('th')}) + ${T('dtm')};\nпринято t_{${i}} = ${T('t' + i)} мм`, out: ['tr' + i, 'mg' + i],
        chk: { ok: b.ok, text: `t_{${i}} = ${fmt(b.t, 2)} мм ${b.ok ? '≥' : '<'} t_{треб,${i}} = ${fmt(b.treq, 2)} мм`, } });
      add(grp, 'b' + i + 'e', { title: `Пояс ${i}: допустимые уровни налива по прочности`, kind: 'calc', f: 'H_{d,max} = x_{i} + [(t − Δt_{c} − Δt_{m})·R/r − 1,2·p] / (0,001·ρ_{d}·g)', src: LK('g-f4', GOST + ', ф. (4), решённая относительно H'),
        sub: `H_{d,max,${i}} = ${T('x' + i)} + [(${T('t' + i)} − ${T('dtc')} − ${T('dtm')}) / 1000·${T('Rd' + i)} / ${T('r')} − 1,2·${T('pM')}] / (0,001·${T('rhod')}·${T('g')});\nH_{g,max,${i}} = ${T('x' + i)} + [(${T('t' + i)} − ${T('dtm')}) / 1000·${T('Rg' + i)} / ${T('r')} − 1,25·${T('pM')}] / (0,001·${T('rg')}·${T('g')})`, out: ['Hdm' + i, 'Hgm' + i],
        note: 'Служебная величина программы: при каком уровне налива пояс ещё проходит по прочности.' });
    });

    add('wind', 'w1', { title: 'Эквивалентная высота', kind: 'calc', f: 'z_{e} = H_{ст} + h_{k}', src: 'СП 20.13330, п. 11.1.5: при h ≤ d принимается z_{e} = h (файл не приложен); ' + LK('km4-view', 'КМ, л. 4'), sub: `z_{e} = ${T('Hst')} + ${T('hk')}`, out: ['ze'] });
    add('wind', 'w2', { title: 'Параметры типа местности', kind: 'norm', f: 'k_{10}, ζ_{10}, α — по типу местности', src: 'СП 20.13330, табл. 11.2, 11.4 (файл не приложен — проверить)', sub: `тип местности ${I.ter}: k_{10} = ${T('k10')}; ζ_{10} = ${T('z10')}; α = ${T('al')}`, out: ['k10', 'z10', 'al'], note: 'Тип местности в КМ не указан — принят по расположению (подтвердить).' });
    add('wind', 'w3', { title: 'Изменение ветрового давления по высоте', kind: 'calc', f: 'k(z_{e}) = k_{10}·(z_{e} / 10)^{2α}', src: 'СП 20.13330, п. 11.1.6', sub: `k(z_{e}) = ${T('k10')}·(${T('ze')} / 10)^{2·${T('al')}}`, out: ['kz'] });
    add('wind', 'w4', { title: 'Коэффициент пульсации давления ветра', kind: 'calc', f: 'ζ(z_{e}) = ζ_{10}·(z_{e} / 10)^{−α}', src: 'СП 20.13330, п. 11.1.8', sub: `ζ(z_{e}) = ${T('z10')}·(${T('ze')} / 10)^{−${T('al')}}`, out: ['zz'] });
    add('wind', 'w5', { title: 'Коэффициент пространственной корреляции', kind: 'norm', f: 'ν — интерполяция по ρ = D, χ = z_{e}', src: 'СП 20.13330, табл. 11.6 (значения внесены по памяти — сверить)', sub: `ρ = ${T('D')} м; χ = ${T('ze')} м → ν = ${T('nu')}`, out: ['nu'] });
    add('wind', 'w6', { title: 'Средняя и пульсационная составляющие', kind: 'calc', f: 'w_{m} = w_{0}·k(z_{e})·C;   w_{p} = w_{m}·ζ(z_{e})·ν', src: LK('km2-II', 'КМ, л. 2, п. 5а') + '; СП 20.13330, ф. (11.1), (11.2)', sub: `w_{m} = ${T('w0')}·${T('kz')}·${T('C')};\nw_{p} = ${T('wm')}·${T('zz')}·${T('nu')}`, out: ['wm', 'wp'] });
    add('wind', 'w7', { title: 'Расчётная ветровая нагрузка', kind: 'calc', f: 'w = w_{m} + w_{p};   w_{р} = w·γ_{f,w}', src: 'СП 20.13330', sub: `w = ${T('wm')} + ${T('wp')};\nw_{р} = ${T('wn')}·${T('gfw')}`, out: ['wn', 'wd'] });
    add('load', 'l1', { title: 'Снеговая нагрузка на крышу', kind: 'calc', f: 'p_{s} = S_{g}·μ', src: LK('km2-II', 'КМ, л. 2, п. 5а') + '; СП 20.13330, раздел 10', sub: `p_{s} = ${T('Sg')}·${T('mu')}`, out: ['ps'], note: 'S_{g} — расчётное значение (СП 20.13330.2011), γ_{f} уже учтён.' });
    add('load', 'l2', { title: 'Массы конструкций', kind: 'calc', f: 'G_{ст} = M_{ст} + M_{к} + M_{л} + M_{лп} + M_{кнп};   G_{кр} = M_{кр} + M_{пл}', src: LK('km4-mass', 'КМ, л. 4, таблица масс'), sub: `G_{ст} = ${T('Mw')} + ${T('Mring')} + ${T('Mlad')} + ${T('Mhat')} + ${T('Mknp')};\nG_{кр} = ${T('Mroof')} + ${T('Mplat')}`, out: ['Gst', 'Gkr'] });
    add('load', 'l3', { title: 'Теплоизоляция стенки и крыши', kind: 'calc', f: 'A_{кр} = 2π·R_{кр}·h_{k};   G_{из} = A·δ_{из}·ρ_{из} / 1000', src: LK('km2-II', 'КМ, л. 2, п. 6') + ' (изоляция 100 мм)', sub: `A_{кр} = 2π·${T('Rsph')}·${T('hk')};\nG_{из.кр} = ${T('Akr')}·(${T('ins_t')} / 1000)·${T('ins_r')} / 1000;\nG_{из.ст} = π·${T('D')}·${T('Hst')}·(${T('ins_t')} / 1000)·${T('ins_r')} / 1000;\nA = π·${T('r')}²`, out: ['Akr', 'Gir', 'Giw', 'Ar'], note: 'Материал и плотность изоляции в КМ не указаны — допущение.' });
    add('force', 'f1', { title: 'Вертикальная сила в основании стенки', kind: 'calc', f: 'N_{0} = [γ_{f,м}·(G_{кр} + G_{ст}) + γ_{f,и}·(G_{из.кр} + G_{из.ст})]·g + p_{s}·A + q_{v}·A;   q_{v} = ψ·γ_{f,v}·p_{v} / 1000', src: 'СП 20.13330 (сочетания нагрузок); упрощённая схема программы',
      sub: `q_{v} = ${T('psi')}·${T('gfv')}·${T('pv')} / 1000;\nN_{0} = [${T('gfm')}·(${T('Gkr')} + ${T('Gst')}) + ${T('gfi')}·(${T('Gir')} + ${T('Giw')})]·${T('g')} + ${T('ps')}·${T('Ar')} + ${T('wv')}·${T('Ar')}`, out: ['wv', 'N0'] });
    add('force', 'f2', { title: 'Сила на уровне кольца жёсткости', kind: 'calc', f: 'φ = (H_{ст} − z_{к}) / H_{ст};   N_{к}: вес стенки и её изоляции умножается на φ', src: 'упрощённая схема программы; ' + LK('km4-mass', 'КМ, л. 4 (кольцо жёсткости)'), sub: `φ = (${T('Hst')} − ${T('ring')}) / ${T('Hst')};\nN_{к} = [${T('gfm')}·(${T('Gkr')} + ${T('Gst')}·${T('phi')}) + ${T('gfi')}·(${T('Gir')} + ${T('Giw')}·${T('phi')})]·${T('g')} + ${T('ps')}·${T('Ar')} + ${T('wv')}·${T('Ar')}`, out: ['phi', 'N1'] });
    add('force', 'f3', { title: 'Опрокидывающий момент от ветра', kind: 'calc', f: 'M = ψ·w_{р}·D·H² / 2', src: 'упрощённая схема программы', sub: `M_{0} = ${T('psi')}·${T('wd')}·${T('D')}·${T('Hst')}² / 2;\nM_{к} = ${T('psi')}·${T('wd')}·${T('D')}·(${T('Hst')} − ${T('ring')})² / 2`, out: ['M0', 'M1'] });
    add('stab', 's1', { title: 'Редуцированная высота и гибкость стенки', kind: 'calc', f: 't_{min} = min(t_{i} − Δt_{c} − Δt_{m});   H_{r} = Σ h_{i}·(t_{min} / (t_{i} − Δt_{c} − Δt_{m}))^{2,5};   δ = r / t_{min}', src: LK('g-f1011', GOST + ', ф. (10), (11)'),
      sub: `t_{min} = min(${belts.map(b => fmt(b.teff, 2)).join('; ')}) = ${T('tmin')} мм;\nH_{r} = ${belts.map((b, j) => fmt(f0[j], 3)).join(' + ')} = ${T('Hr0')} м;\nH_{r,к} (выше кольца) = ${belts.filter((b, j) => f1[j] > 0).map(b => fmt(f1[b.i - 1], 3)).join(' + ') || '0'} = ${T('Hr1')} м;\nδ = ${fmt(r * 1000, 1)} / ${T('tmin')}`, out: ['tmin', 'Hr0', 'Hr1', 'dl'] });
    if (!stab.skip) {
      const dlv = dl;
      const c0t = dlv < 1220 ? ['C_{0} = 0,04 + 40 / δ   (400 ≤ δ < 1220)', `C_{0} = 0,04 + 40 / ${T('dl')}`] : dlv < 2500 ? ['C_{0} = 0,085 − 10^{−5}·δ   (1220 ≤ δ < 2500)', `C_{0} = 0,085 − 10^{−5}·${T('dl')}`] : ['C_{0} = 0,065 − 2·10^{−6}·δ   (2500 ≤ δ < 5000)', `C_{0} = 0,065 − 2·10^{−6}·${T('dl')}`];
      add('stab', 's2', { title: 'Критическое меридиональное напряжение', kind: 'calc', f: c0t[0] + ';   σ_{cr1} = C_{0}·E / δ', src: LK('g-f1011', GOST + ', ф. (10), (11)'), sub: `${c0t[1]};\nσ_{cr1} = ${T('C0')}·${T('E')} / ${T('dl')}`, out: ['C0', 'scr1'], note: 'В тексте ГОСТ для δ ≥ 2500 напечатано «2·10^{−5}δ» (разрыв функции) — применено 2·10^{−6}.' });
      const vv = (sfx, lbl, Hrk, Nk, Mk) => `σ_{cr2${lbl}} = 0,55·(${T('r')} / ${T(Hrk)})·${T('E')} / ${T('dl')}^{1,5};\nσ_{1${lbl}} = [${T(Nk)} / (2π·${T('r')}·${fmt(tmin / 1000, 5)}) + ${T(Mk)} / (π·${T('r')}²·${fmt(tmin / 1000, 5)})] / 1000;\nσ_{2${lbl}} = (${T('wv')} + 0,5·${T('psi')}·${T('wd')})·${T('r')} / ${fmt(tmin / 1000, 5)} / 1000;\nK${lbl ? '_{к}' : ''} = ${T('s1' + sfx)} / ${T('scr1')} + ${T('s2' + sfx)} / ${T('scr2' + sfx)}`;
      add('stab', 's3', { title: 'Проверка устойчивости — без кольца жёсткости', kind: 'chk', f: 'σ_{cr2} = 0,55·(r / H_{r})·E / √(δ³);   σ_{1}/σ_{cr1} + σ_{2}/σ_{cr2} ≤ 1', src: LK('g-f9', GOST + ', ф. (9)') + '; ' + LK('g-f1011', 'ф. (10)'), sub: vv('0', '', 'Hr0', 'N0', 'M0'), out: ['scr2' + '0', 's10', 's20', 'ratio0'],
        chk: { ok: stab.noring.ok, text: `K = ${fmt(stab.noring.ratio, 3)} ${stab.noring.ok ? '≤' : '>'} 1` }, note: 'σ_{1} и σ_{2} в ГОСТ-2023 не заданы (отсылка к СП 16/СП 20): использована упрощённая схема — результат ориентировочный.' });
      if (stab.ring) add('stab', 's4', { title: 'Проверка устойчивости — верхняя часть над кольцом жёсткости', kind: 'chk', f: 'то же, с H_{r,к}, N_{к}, M_{к}', src: LK('g-f1011', GOST + ', ф. (11): h_{i} — расстояние от кромки до кольца'), sub: vv('1', 'к', 'Hr1', 'N1', 'M1'), out: ['scr21', 's11', 's21', 'ratio1'], chk: { ok: stab.ring.ok, text: `K_{к} = ${fmt(stab.ring.ratio, 3)} ${stab.ring.ok ? '≤' : '>'} 1` } });
    }
    // fix out keys naming (scr20 etc. exist as 'scr2'+sfx)
    res.steps.forEach(s => { s.out = (s.out || []).filter(k => Q[k]); });

    /* ---------- проверки ---------- */
    const bad = belts.filter(b => !b.ok), badD = belts.filter(b => !b.okD), badG = belts.filter(b => !b.okG);
    res.checks.push({ id: 'c-all', ok: !bad.length, text: bad.length ? `Условие (3) не выполняется для поясов: ${bad.map(b => b.i).join(', ')} — не хватает до ${fmt(Math.max(...bad.map(b => -b.margin)), 2)} мм` : 'Условие (3) выполняется для всех поясов', go: 'wall' });
    res.checks.push({ id: 'c-exp', ok: !badD.length, text: badD.length ? 'Эксплуатация (td + Δtc): не проходят пояса ' + badD.map(b => b.i).join(', ') : 'Эксплуатация: прочность поясов обеспечена', go: 'wall' });
    res.checks.push({ id: 'c-hyd', ok: !badG.length, text: badG.length ? 'Гидроиспытания (tg): не проходят пояса ' + badG.map(b => b.i).join(', ') : 'Гидроиспытания: прочность поясов обеспечена', go: 'wall' });
    const Hdall = Math.min(...belts.map(b => b.Hdmax)), Hgall = Math.min(...belts.map(b => b.Hgmax));
    res.checks.push({ id: 'c-lvl', ok: Hdall >= Hd - 1e-9, text: `Допустимый уровень продукта по прочности: ${fmt(Hdall, 2)} м ${Hdall >= Hd ? '≥' : '<'} H_{d} = ${fmt(Hd, 2)} м`, go: 'wall' });
    if (!stab.skip) { res.checks.push({ id: 'c-st0', ok: stab.noring.ok, info: true, text: `Устойчивость без кольца (упрощённо): K = ${fmt(stab.noring.ratio, 3)}`, go: 'stab' }); if (stab.ring) res.checks.push({ id: 'c-st1', ok: stab.ring.ok, info: true, text: `Устойчивость выше кольца (упрощённо): K = ${fmt(stab.ring.ratio, 3)}`, go: 'stab' }); }
    res.V.summary = { all_ok: !bad.length, bad: bad.map(b => b.i), tmin, min_margin: Math.min(...belts.map(b => b.margin)), Hdmax: Hdall, Hgmax: Hgall };
    res.sections = [
      { grp: 'prep', n: '1', t: 'Подготовка величин' }, { grp: 'mat', n: '2', t: 'Характеристики материала и коэффициенты' },
      ...belts.map(b => ({ grp: 'b' + b.i, n: '3.' + b.i, t: 'Стенка, пояс ' + b.i, parent: '3', pt: 'Расчёт стенки по поясам' })),
      { grp: 'wind', n: '4', t: 'Ветровая нагрузка' }, { grp: 'load', n: '5', t: 'Снег, вес конструкций и изоляция' },
      { grp: 'force', n: '6', t: 'Вертикальная сила и момент ветра' }, { grp: 'stab', n: '7', t: 'Устойчивость стенки' }];
    res.ok = true; return res;
  }

  root.EN = { tdOf, fmt, run, N, FIELDS, FMAP, AUTO, T, LK, isNum, clone, tankClass, thByD, nuInterp, parseThick, emptyDraft, exampleDraft, autoPreview };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* РВС: конструкции и проверки — коррозия и ресурс, массы, нагрузки, крыша и балки, напряжения по высоте,
   граничные условия, опрокидывание и анкеры (ГОСТ 31385-2023, прил. Г.5). Расчётное ядро EN не изменяется:
   модуль читает его результаты (res.Q, res.V) и добавляет проверки. Каждая формула — отдельная функция. */

    const add = (n, nv, gf, u, src, note, combo) => L.push({ n, nv, gf, dv: isNum(nv) && isNum(gf) ? nv * gf : nv, u, src, note: note || '', combo: combo || '' });
    add('Вес стенки с кольцами (G_{s})', kn(M.T.wall), gfm, 'кН', 'КМ л. 4 × g', '', '1, 2, 3');
    add('Вес оборудования на стенке (G_{s0})', kn(M.T.wallEq), gfm, 'кН', 'КМ л. 4 × g' + (st.ladOnWall ? '' : '; лестница исключена (п. 6.1.11.8)'), '', '1, 2, 3');
    add('Вес крыши (G_{r})', kn(M.T.roof), gfm, 'кН', 'КМ л. 4 × g', '', '1, 2, 3');
    add('Вес оборудования на крыше (G_{r0})', kn(M.T.roofEq), gfm, 'кН', 'КМ л. 4 × g', '', '1, 2, 3');
    add('Вес изоляции стенки (G_{st})', kn(Q.Giw.v), gfi, 'кН', 'расчёт ядра', '', '1, 2, 3');
    add('Вес изоляции крыши (G_{rt})', kn(Q.Gir.v), gfi, 'кН', 'расчёт ядра', '', '1, 2, 3');
    add('Вес днища', kn(M.T.bottom), gfm, 'кН', 'КМ л. 4 × g', 'передаётся непосредственно на основание', 'основание');
    add('Снег на крышу p_{s} = S_{g}·μ', Q.ps.v, 1, 'кПа', 'СП 20.13330.2011 (район) — значение ядра уже расчётное', 'S_{g} в ядре принят как расчётное значение', '1, 2');
    add('Ветер на стенку w', Q.wn.v, Q.gfw.v, 'кПа', 'СП 20.13330, расчёт ядра', '', '1, 2, 3');
    add('Избыточное давление p', Q.p.v / 1000, 1.2, 'кПа', 'КМ л. 2; коэффициент 1,2 — ф. (4), (Г.8)', 'при гидроиспытаниях — 1,25', '3');
    add('Вакуум p_{v}', Q.pv.v / 1000, Q.gfv.v, 'кПа', 'КМ л. 2', 'в ядре дополнительно × ψ', '1, 2');
    add('Продукт ρ_{d}·g·π·r²·H_{d}', M.T.prodKN, 1, 'кН', 'расчёт; цилиндр без учёта уклона днища', 'на днище; в опрокидывании пустого резервуара не учитывается (табл. Г.1)', '1');
    add('Вода при гидроиспытаниях', M.T.waterKN, 1, 'кН', 'расчёт; цилиндр', '', '2');
    L.push({ n: 'Сейсмическое воздействие', nv: null, gf: null, dv: null, u: '—', src: 'п. 6.1.4.7; СП 14.13330', note: 'не рассчитывается: сейсмичность площадки не задана', combo: '4', st: 'na' });
    return L;
  }

  /* ---------- 6. Балка на двух опорах с произвольной нагрузкой q(x), численно ---------- */
  // L — м, q — кН/м, EI — кН·м². Возвращает реакции, M, V, прогиб по сетке.
  function beamSS(L, q, EI, n) {
    n = n || 600; const h = L / n, X = [], Q = [];
    for (let i = 0; i <= n; i++) { X.push(i * h); Q.push(q(i * h)); }
    const trap = (f) => { let s = 0; for (let i = 0; i < n; i++) s += (f(i) + f(i + 1)) / 2 * h; return s; };
    const W = trap(i => Q[i]), RA = trap(i => Q[i] * (L - X[i])) / L, RB = W - RA;
    const V = [RA], M = [0];
    for (let i = 1; i <= n; i++) { V.push(V[i - 1] - (Q[i - 1] + Q[i]) / 2 * h); M.push(M[i - 1] + (V[i - 1] + V[i]) / 2 * h); }
    const k = M.map(m => m / EI), th = [0], y = [0];
    for (let i = 1; i <= n; i++) th.push(th[i - 1] + (k[i - 1] + k[i]) / 2 * h);
    for (let i = 1; i <= n; i++) y.push(y[i - 1] + (th[i - 1] + th[i]) / 2 * h);
    const c = y[n] / L; const f = y.map((v, i) => c * X[i] - v);            // y(0) = y(L) = 0, прогиб вниз > 0
    let im = 0; M.forEach((m, i) => { if (Math.abs(m) > Math.abs(M[im])) im = i; }); let jf = 0; f.forEach((v, i) => { if (Math.abs(v) > Math.abs(f[jf])) jf = i; });
    return { X, M, V, f, W, RA, RB, Mmax: M[im], xM: X[im], Vmax: Math.max(Math.abs(RA), Math.abs(RB)), fmax: f[jf], xf: X[jf] };
  }
  const sigB = (M, W) => 1000 * M / W;                 // σ = M / W_x, МПа (M — кН·м, W — см³)
  const tauB = (V, S, I, tw) => 100 * V * S / (I * tw); // τ = V·S_x / (I_x·t_w), МПа (V — кН, S — см³, I — см⁴, t_w — мм)
  const EIof = (E, I) => E * I * 1e-5;                 // кН·м² (E — МПа, I — см⁴)

  /* ---------- 7. Крыша и балки ---------- */
  function roofCalc(res, st, M) {
    const Q = res.Q, RF = st.roof, r = Q.r.v, D = Q.D.v, g = Q.g.v, A = Q.Ar.v, out = { checks: [], need: [], beams: [], geo: [] };
    // геометрия и конструктивные требования
    const Rs = Q.Rsph.v, hkR = Rs > r ? Rs - Math.sqrt(Rs * Rs - r * r) : null;
    out.geo.push({ n: 'Радиус сферы R_{кр} в пределах 0,7D…1,5D (купольная крыша)', ref: GOST + ', п. 6.1.6.6', val: fmt(Rs, 2) + ' м; 0,7D = ' + fmt(0.7 * D, 2) + ' м, 1,5D = ' + fmt(1.5 * D, 2) + ' м', st: RF.type !== 'dome' ? 'na' : Rs >= 0.7 * D - 1e-9 && Rs <= 1.5 * D + 1e-9 ? 'pass' : 'fail' });
    out.geo.push({ n: 'Стрела h_{k} по R_{кр} и D: R − √(R² − r²)', ref: 'геометрия сферического сегмента', val: hkR === null ? '—' : fmt(hkR, 3) + ' м при заданной h_{k} = ' + fmt(Q.hk.v, 3) + ' м (разница ' + fmt(Q.hk.v - hkR, 3) + ' м)', st: hkR === null ? 'fail' : Math.abs(hkR - Q.hk.v) <= 0.05 ? 'pass' : 'warn', note: 'R_{кр} — радиус сферической поверхности крыши (КМ л. 8: R50000). Расхождение со стрелой подъёма, заданной в исходных данных, — проверить по КМ (отметка опорного кольца, диаметр опирания).' });
    out.hkR = hkR;
    const tmin = RF.type === 'dome' || RF.type === 'cone' ? (RF.frameBelow ? 4 + (RF.dtcr || 0) : 4) : 4;
    out.geo.push({ n: 'Толщина настила не менее табл. 6' + (RF.frameBelow ? ' (каркас снизу: 4,0 + Δt_{cr})' : ' (каркас сверху: 4,0)'), ref: GOST + ', табл. 6', val: isNum(RF.deckT) ? fmt(RF.deckT, 1) + ' мм ≥ ' + fmt(tmin, 1) + ' мм' : '—', st: !isNum(RF.deckT) ? 'data' : RF.deckT >= tmin - 1e-9 ? 'pass' : 'fail' });
    const pr = profile(st, RF.prof);
    out.geo.push({ n: 'Толщина элементов каркаса не менее табл. 6', ref: GOST + ', табл. 6', val: pr ? 'стенка профиля ' + fmt(pr.s, 1) + ' мм ≥ ' + fmt(tmin, 1) + ' мм' : '—', st: !pr ? 'data' : pr.s >= tmin - 1e-9 ? 'pass' : 'fail' });
    // нагрузка на 1 м² плана: первое основное сочетание (п. 6.1.6.2 а)
    const gfm = res.draft.v.gfm, gfi = res.draft.v.gfi;
    const gDead = (M.T.roof + M.T.roofEq) * g / A, gIns = Q.Gir.v * g / A;
    const q1 = gfm * gDead + gfi * gIns + Q.ps.v + Q.wv.v;
    out.q1 = { gDead, gIns, ps: Q.ps.v, wv: Q.wv.v, gfm, gfi, q: q1 };
    // второе основное сочетание (п. 6.1.6.2 б): собственный вес (благоприятный), избыточное давление, отсос ветра
    const pk = Q.p.v / 1000, q2 = RF.gfFav * (gDead + gIns) - 1.2 * pk - (isNum(RF.suct) ? RF.suct : 0);
    out.q2 = { gf: RF.gfFav, p: pk, suct: RF.suct, q: q2 };
    if (!isNum(RF.suct)) out.need.push('отсос ветра на крышу (СП 20.13330, прил. В) — во втором сочетании принят 0');
    out.need.push('несимметричное распределение снега на куполе (СП 20.13330, прил. Б) — не рассчитывается, учтено только равномерное p_{s}');
    const miss = []; if (!pr) miss.push('профиль радиальной балки'); if (!isNum(RF.nRad)) miss.push('число радиальных балок'); if (!isNum(RF.r0)) miss.push('радиус центрального кольца'); if (!isNum(RF.Ryn)) miss.push('R_{yn} стали каркаса');
    out.miss = miss; if (miss.length) { out.st = 'data'; return out; }
    const Ry = RF.Ryn / RF.gm, Rs_ = 0.58 * Ry, gc = RF.gc, E = Q.E.v, n = RF.nRad, r0 = RF.r0, L = r - r0;
    out.mat = { Ryn: RF.Ryn, gm: RF.gm, Ry, Rs: Rs_, gc, E };
    const one = (name, kind, prof, Lb, qf, qtxt, cnt, qs) => {
      const EI = EIof(E, prof.Ix), b = beamSS(Lb, qf, EI), sg = sigB(Math.abs(b.Mmax), prof.Wx), ta = tauB(b.Vmax, prof.Sx, prof.Ix, prof.s), fu = Lb / RF.fLim;
      const k1 = sg / (Ry * gc), k2 = ta / (Rs_ * gc), k3 = Math.abs(b.fmax) / fu;
      return { name, kind, prof, L: Lb, cnt, qtxt, qs, EI, b, sg, ta, fu, k1, k2, k3, mass: cnt * Lb * prof.m / 1000, st: Math.max(k1, k2) > 1 + 1e-9 ? 'fail' : 'pass', stF: k3 > 1 + 1e-9 ? 'fail' : 'pass' };
    };
    // радиальная балка: проекция пролёта L = r − r0; погонная нагрузка растёт пропорционально радиусу (грузовая ширина 2πρ/n)
    const qr = (q, x) => q * 2 * PI * (r0 + x) / n;
    out.beams.push(one('Радиальная балка — сочетание 1', 'rad', pr, L, x => qr(q1, x), 'q(x) = q_{1}·2π(r_{0} + x)/n', n, [qr(q1, 0), qr(q1, L)]));
    if (q2 < 0) out.beams.push(one('Радиальная балка — сочетание 2 (отрыв)', 'rad2', pr, L, x => qr(q2, x), 'q(x) = q_{2}·2π(r_{0} + x)/n (вверх)', n, [qr(q2, 0), qr(q2, L)]));
    const pk2 = profile(st, RF.ringProf), nR = isNum(RF.nRing) ? RF.nRing : 0;
    if (nR > 0 && pk2) { const bw = L / (nR + 1); for (let k = 1; k <= nR; k++) { const rho = r0 + k * bw, s = 2 * PI * rho / n; out.beams.push(one('Кольцевой прогон ' + k + ' (ρ = ' + fmt(rho, 2) + ' м)', 'ring', pk2, s, () => q1 * bw, 'q = q_{1}·b, b = ' + fmt(bw, 3) + ' м', n, [q1 * bw, q1 * bw])); } }
    else if (nR > 0 && !pk2) out.need.push('профиль кольцевых прогонов');
    // купол: радиальные элементы работают как распорная (арочная) система вместе с опорным кольцом — балочная схема неприменима
    if (RF.type === 'dome') out.beams.filter(x => x.kind !== 'ring').forEach(x => { x.st = 'na'; x.stF = 'na'; x.ref = true; });
    if (RF.type === 'dome') out.need.push('радиальные балки купола: распорная система — несущая способность по п. 6.1.6.2 определяется КЭ-расчётом; значения балочной схемы приведены справочно (верхняя оценка без распора)');
    const act = out.beams.filter(x => !x.ref);
    out.st = act.some(x => x.st === 'fail' || x.stF === 'fail') ? 'fail' : RF.type === 'dome' ? (act.length ? 'na' : 'na') : 'pass';
    return out;
  }

  /* ---------- 8. Напряжения в стенке по высоте ---------- */
  const mises = (s1, s2) => Math.sqrt(s1 * s1 - s1 * s2 + s2 * s2);   // плоское напряжённое состояние без касательных напряжений
  const hoop = (rho, g, H, z, kp, p, r, te) => (0.001 * rho * g * Math.max(H - z, 0) + kp * p) * r / (te / 1000);  // МПа
  function points(res, step) {
    const Hs = res.Q.Hst.v, set = new Map(), add = (z, why) => { const k = Math.round(z * 1e6) / 1e6; if (k < -1e-9 || k > Hs + 1e-9) return; if (!set.has(k)) set.set(k, new Set()); set.get(k).add(why); };
    for (let z = 0; z <= Hs + 1e-9; z += step) add(z, 'шаг ' + fmt(step, 2) + ' м');
    add(Hs, 'верх стенки'); res.V.belts.forEach(b => { add(b.z, 'низ пояса ' + b.i); add(b.zt, 'верх пояса ' + b.i); add(b.x, 'x_{' + b.i + '} (ф. 4)'); });
    if (isNum(res.Q.ring.v)) add(res.Q.ring.v, 'кольцо жёсткости'); if (isNum(res.draft.v.ring2)) add(res.draft.v.ring2, 'кольцо жёсткости');
    return [...set.keys()].sort((a, b) => a - b).map(z => ({ z, why: [...set.get(z)] }));
  }
  function stresses(res, st, state) {
    state = state || st.sig.state || 'op';
    const Q = res.Q, r = Q.r.v, Hs = Q.Hst.v, g = Q.g.v, D = Q.D.v, p = Q.pM.v, v = res.draft.v, test = state === 'test';
    const rho = test ? Q.rg.v : Q.rhod.v, H = test ? Q.Hg.v : Q.H.v, kp = test ? 1.25 : 1.2;
    const rows = [];
    points(res, st.sig.step || 1.5).forEach(P => {
      res.V.belts.filter(b => P.z >= b.z - 1e-9 && P.z <= b.zt + 1e-9).forEach(b => {
        const te = test ? b.t - Q.dtm.v : b.t - Q.dtc.v - Q.dtm.v, R = test ? b.Rg : b.Rd, a = (Hs - P.z) / Hs;
        const N = (v.gfm * (Q.Gkr.v + Q.Gst.v * a) + v.gfi * (Q.Gir.v + Q.Giw.v * a)) * g + Q.ps.v * Q.Ar.v;   // кН
        const Mz = Q.psi.v * Q.wd.v * D * Math.pow(Hs - P.z, 2) / 2;                                         // кН·м
        const sN = -N / (2 * PI * r * te / 1000) / 1000, sM = Mz / (PI * r * r * te / 1000) / 1000, sP = kp * p * r / (2 * te / 1000);
        const sth = hoop(rho, g, H, P.z, kp, p, r, te), szL = sN - sM + sP, szW = sN + sM + sP;
        const eL = mises(sth, szL), eW = mises(sth, szW), eq = Math.max(eL, eW);
        rows.push({ z: P.z, why: P.why, i: b.i, te, p: 0.001 * rho * g * Math.max(H - P.z, 0) + kp * p, sth, sN, sM, sP, szL, szW, eq, side: eL >= eW ? 'подветренная' : 'наветренная', R, k: eq / R, kth: sth / R, st: eq <= R + 1e-9 ? 'pass' : 'fail', ctrl: P.why.some(w => /^x_/.test(w)) });
      });
    });
    const worst = rows.reduce((a, x) => (!a || x.k > a.k ? x : a), null);
    return { state, rows, worst, st: rows.some(x => x.st === 'fail') ? 'fail' : 'pass', H, rho, kp, step: st.sig.step || 1.5 };
  }

  /* ---------- 9. Опрокидывание и анкеры (прил. Г.5) ---------- */
  function overturn(res, st, M) {
    const Q = res.Q, O = st.ov, r = Q.r.v, D = Q.D.v, g = Q.g.v, gn = Q.gn.v, MN = t => t * g / 1000, Hs = Q.Hst.v, RF = st.roof;
    const Gs = MN(M.T.wall), Gs0 = MN(M.T.wallEq), Gr = MN(M.T.roof), Gr0 = MN(M.T.roofEq), Gst = MN(Q.Giw.v), Grt = MN(Q.Gir.v);
    const p = Q.pM.v, pv = Q.pv.v / 1e6, ps = Q.Sg.v / 1000;   // (Г.4): p_s — расчётная снеговая нагрузка на поверхности земли (S_g), не на крыше
    const ce = D <= 60 ? 0.85 : D > 100 ? 1.0 : 0.85 + 0.00375 * (D - 60);
    const Mws = Q.wd.v * D * Hs * Hs / 2 / 1000;                 // МН·м: равнодействующая w_р·D·H_ст на плече H_ст/2
    const needMwr = !isNum(O.Mwr), Mwr = needMwr ? 0 : O.Mwr / 1000;
    const Mw = gn * (Mws + Mwr);                                  // (Г.1)
    const Qmax = gn * (1.05 * (Gs + Gr) + O.psiL1 * 1.05 * (Gs0 + Gr0) + 1.3 * O.psiL2 * (Gst + Grt)) + (1.4 * 0.7 * O.psiT1 * ce * ps + 1.2 * O.psiL3 * pv) * PI * r * r;   // (Г.4)
    const Qmin = gn * ((Gs + Gr) + O.psiL1 * (Gs0 + Gr0) + O.psiL2 * (Gst + Grt) - 1.2 * O.psiL3 * p * PI * r * r);   // (Г.8)
    const qmax = Qmax / (2 * PI * r) + Mw / (PI * r * r), qmin = Qmax / (2 * PI * r) - Mw / (PI * r * r);   // (Г.2), (Г.3)
    const fr = Q.hk.v, zero = RF.type === 'float' || (RF.type === 'cone' && Math.atan(fr / r) * 180 / PI >= 5) || ((RF.type === 'dome' || RF.type === 'sphere') && fr >= 0.1 * D);
    const needF = !zero && !isNum(O.Fwvr), Fwvr = zero ? 0 : isNum(O.Fwvr) ? O.Fwvr / 1000 : 0;   // ввод — кН, расчёт — МН
    const hold = (Qmin - Fwvr) * r, c1 = Qmin < 0, c2 = hold <= Mw, need = c1 || c2;   // (Г.7)
    const prelim = needMwr || needF;   // вывод без M_wr / F_wvr — предварительный
    const out = { prelim, Gs, Gs0, Gr, Gr0, Gst, Grt, p, pv, ps, ce, Mws, Mwr, Mw, Qmax, Qmin, qmax, qmin, fr, zeroF: zero, Fwvr, hold, c1, c2, need, ratio: Mw > 0 ? hold / Mw : null, needMwr, needF, lift: qmin < 0 };
    out.st = needMwr || needF ? 'data' : (need && !O.anch) ? 'fail' : 'pass';
    // анкеры (Г.9; пп. 6.1.12.5, 6.1.12.7, 6.1.12.8)
    if (O.anch) {
      const a = { checks: [] };
      if (![O.na, O.Da, O.d].every(isNum)) { a.st = 'data'; a.need = 'число, диаметр установки и диаметр болтов'; }
      else {
        a.Na = (4 * Mw / O.Da - Qmin) / O.na; a.NaKN = a.Na * 1000; a.As = BOLT_AS[O.d] || null; a.pitch = PI * O.Da / O.na;
        a.checks.push({ n: 'Диаметр анкерного болта ≥ 24 мм', ref: 'п. 6.1.12.7', val: 'M' + O.d, st: O.d >= 24 ? 'pass' : 'fail' });
        a.checks.push({ n: 'Шаг анкеров по дуге ≤ 3 м', ref: 'п. 6.1.12.8', val: fmt(a.pitch, 2) + ' м', st: a.pitch <= 3 + 1e-9 ? 'pass' : 'fail' });
        if (a.Na <= 0) a.checks.push({ n: 'Усилие в болте (Г.9)', ref: 'Г.5.12', val: fmt(a.NaKN, 1) + ' кН — болты не растянуты', st: 'pass' });
        else if (!a.As || !isNum(O.Ryna) || !isNum(O.Runa)) a.checks.push({ n: 'Напряжение в болте ≤ min(0,5·R_{yn}; R_{un}/3)', ref: 'п. 6.1.12.5', val: 'нужны R_{yn}, R_{un} материала анкера' + (a.As ? '' : ' и площадь резьбы'), st: 'data' });
        else { a.sig = a.Na * 1e6 / a.As; a.lim = Math.min(0.5 * O.Ryna, O.Runa / 3); a.checks.push({ n: 'Напряжение в болте ≤ min(0,5·R_{yn}; R_{un}/3)', ref: 'п. 6.1.12.5', val: fmt(a.sig, 1) + ' МПа ' + (a.sig <= a.lim ? '≤ ' : '> ') + fmt(a.lim, 1) + ' МПа', st: a.sig <= a.lim + 1e-9 ? 'pass' : 'fail' }); }
        a.st = a.checks.some(c => c.st === 'fail') ? 'fail' : a.checks.some(c => c.st === 'data') ? 'data' : 'pass';
      }
      out.anch = a; if (out.st !== 'data' && a.st !== 'pass') out.st = a.st;
    }
    return out;
  }

  /* ---------- 10. Граничные условия ---------- */
  const BC_OPT = {
    roofWall: { ring: 'верхнее опорное кольцо, крыша опирается на кольцо (п. 6.1.5.3)', weld: 'настил приварен к стенке без опорного кольца', free: 'крыша не связана со стенкой (плавающая)' },
    found: { ring: 'кольцевой железобетонный фундамент под стенкой', slab: 'сплошная железобетонная плита', sand: 'грунтовое основание с песчаной подушкой без фундаментного кольца' },

<script>
/* Расчётные схемы модуля «Конструкции и проверки». Данные — только из ST.all(res, st) и res; собственных чисел нет. */
(function (root) {

      <h2>Горячие клавиши</h2>${tbl(['Клавиши', 'Действие'], keys)}`;
  }
  function projDoc() {
    return `<h1>9. Проекты, файлы и резервные копии</h1>
      <h2>Файл проекта</h2><p>Проект хранится в одном файле <code>.rvsproj</code>: все исходные данные (основной расчёт и конструкции), свои значения нормативных коэффициентов, ручные изменения в решении, история сохранений. Внутри — ZIP-архив с <code>project.json</code>. Вместе с данными сохраняется снимок результатов на момент сохранения (расчётные величины, толщины по поясам, итоги проверок) — для истории и сверки. При открытии проект пересчитывается заново, поэтому результаты на экране всегда соответствуют данным.</p>
      <h2>Где хранятся проекты</h2><p>Папку выбираете вы при первом сохранении. По умолчанию предлагается <code>Документы\\Проекты РВС</code> (изменить — «Проект и настройки → Настройки»). Путь к файлу показан на главной странице и в разделе «Проект»; кнопка «Показать в папке» открывает его в Проводнике.</p>
      <h2>Сохранение</h2>${ul(['«Сохранить» (Ctrl+S) записывает проект в его файл; у нового проекта программа спросит папку и имя.', '«Сохранить как…» (Ctrl+Shift+S) — копия под другим именем или в другой папке; дальше работа идёт с новым файлом.', 'Запись выполняется безопасно: сначала во временный файл, затем замена — при сбое питания прежний файл не повреждается.', 'Номер ревизии увеличивается при каждом сохранении; история показана в разделе «Проект».'])}
      <h2>Резервные копии</h2><p>Перед каждой перезаписью предыдущая версия файла копируется в папку <code>Резервные копии</code> рядом с проектом, с датой, временем и номером ревизии в имени. Хранится не более заданного числа копий (по умолчанию 10; изменить — в «Настройках»). Открыть копию — «Проект → Резервные копии → Открыть как копию»: копия открывается как новый несохранённый проект и не перезаписывает основной файл.</p>
      <h2>Несохранённые изменения и автосохранение</h2>${ul(['Знак «•» в заголовке окна и надпись на главной странице означают несохранённые изменения.', 'При закрытии программы, открытии другого проекта или создании нового программа спрашивает: «Сохранить», «Не сохранять» или «Отмена».', 'Автосохранение (по умолчанию каждые 2 минуты) записывает несохранённые изменения в служебную папку программы, не трогая файл проекта. Если программа была закрыта аварийно, на главной странице появится «Найдены несохранённые изменения» с кнопкой «Восстановить».', 'Если при открытии проекта найдено автосохранение новее файла, программа предложит восстановить его.'])}
      <h2>Повреждённые и несовместимые файлы</h2><p>Если файл повреждён, обрезан или не является проектом РВС, программа сообщает причину и не изменяет текущий проект. Файл, созданный более новой версией программы, не открывается — нужно обновить программу. Проекты предыдущих версий открываются и при сохранении переводятся в текущий формат. Данные разделов, удалённых в версии 2.0.0, остаются в файле без изменений (глава 12).</p>
      <h2>Резервное копирование данных</h2>${ul(['Копируйте файлы <code>.rvsproj</code> (и при желании папку «Резервные копии») на другой диск, сервер или в облачное хранилище — этого достаточно для восстановления работы на любом компьютере с программой.', 'Настройки программы и автосохранения находятся в папке данных программы (<code>%APPDATA%\\RVS-Calc</code>; у портативной версии — папка «Данные» рядом с программой). Их копировать не обязательно.', 'При обновлении и удалении программы проекты и настройки не удаляются.'])}`;
  }
  function axDoc() {
    return `<h1>11. Приблизительные данные</h1><p>На страницах модуля «Конструкции и проверки» есть кнопка <b>«≈ Заполнить приблизительными данными»</b>. Она нужна, чтобы посмотреть, как работает расчёт, и понять, какие данные нужны: толщины и припуски днища и крыши, каркас крыши, ветер на крышу, скорости коррозии. Проектным расчётом результат с приблизительными данными не является.</p>
      <h2>Как работает</h2>${ul(['Ничего не заполняется само — только по нажатию. Открытие проекта или примера, пересчёт и выгрузка отчёта данные не меняют.', 'Заполняются только <b>пустые</b> поля; введённые вами значения не меняются. Если пустых полей нет, кнопка неактивна («все данные введены»). Без исходных данных резервуара кнопка тоже неактивна: значения считаются от D, H, толщин поясов и припусков текущего проекта.', 'Перед заполнением открывается окно со списком: поле, значение, как получено (а — из данных проекта; б — по ГОСТ 31385-2023 с пунктом; в — оценка разработчика), обоснование и риск. Строки можно снять флажком.', 'Риск «высокий» — значение прямо определяет вывод о прочности или анкеровке: каркас крыши (число балок, радиус центрального кольца, прогоны, R<sub>yn</sub> стали каркаса), ветер на крышу, скорости коррозии. Их нужно заменить данными объекта.'])}
      <h2>Пометки</h2>${ul(['Поле с приблизительным значением выделено цветом и значком «≈»; подсказка показывает источник. Если вы измените значение, пометка снимается.', 'Баннер на страницах модуля: «Расчёт выполнен с приблизительными исходными данными (N полей, из них K с высоким риском) — результат демонстрационный», кнопки «Список», «Подтвердить все» (значения остаются и считаются вашими), «Убрать приблизительные данные» (очищаются только поля, которые заполнила кнопка и которые вы не меняли).', 'Отчёт Word и итоговый PDF: в начале — предупреждение и таблица приблизительных значений, в колонтитуле Word — «ПРИБЛИЗИТЕЛЬНЫЕ ИСХОДНЫЕ ДАННЫЕ», в приложении А — своя таблица, выводы — «демонстрационно: выполнено / не выполнено».'])}
      <h2>Что кнопка не заполняет</h2>${ul(['Марку стали и расчётные сопротивления стенки, район строительства и климатические нагрузки — это исходные данные проекта.', 'Фактические замеры толщин, даты ввода и обследования, сейсмичность площадки.', 'Профили балок и прогонов, фундамент и основание (у них есть значения по умолчанию), анкеры (подбор анкеров — проектное решение).'])}`;
  }
  function newDoc() {
    return `<h1>12. Что изменилось в версии 2.0.0</h1><p>Из программы удалена группа разделов «Специальные модули» вместе с программным кодом. Программа сосредоточена на расчёте стенки по ГОСТ 31385-2023 и модуле «Конструкции и проверки».</p>

      <h2>Что осталось</h2>${ul(['Расчёт стенки по поясам, ветер, снег и вертикальные нагрузки, устойчивость стенки (главы 3–8).', 'Конструкции и проверки: днище, крыша, коррозия и срок службы, массы и нагрузки, балки крыши, напряжения по высоте, граничные условия, опрокидывание и анкеры.', 'Проекты, резервные копии, автосохранение, мастер ввода, итоговый отчёт, отчёт Word, руководство; кнопка «Приблизительные данные» — для «Конструкций и проверок».'])}
      <h2>Старые проекты</h2>${ul(['Проекты версий 1.0–1.4 открываются без ошибок. Результаты расчёта стенки и конструкций те же, что в версии 1.4.0.', 'Если в проекте есть данные удалённых разделов, при открытии появляется сообщение «В проекте есть данные разделов, удалённых в версии 2.0.0 (…) — они сохранены в файле, но не используются». Эти данные при сохранении остаются в файле без изменений: открыв проект в версии 1.4.0, их можно использовать снова.', 'Папки «&lt;имя проекта&gt; — ANSYS» рядом с проектами программа не трогает; их можно удалить вручную, если результаты ANSYS больше не нужны.', 'Рабочая папка расчётов OpenFOAM (результаты CFD прежних версий) — тоже ваши данные: установщик её не удаляет. Путь к ней был указан в настройках CFD версии 1.x; если результаты не нужны, удалите папку вручную.'])}
      <h2>Как вернуть удалённые разделы</h2><p>Только установкой версии 1.4.0 (установщик или исходники <code>RVS-исходники-1.4.0.zip</code>). Проекты, сохранённые в 2.0.0, открываются в 1.4.0 со всеми данными.</p>`;
  }

  function instDoc() {
    return `<h1>10. Установка, обновление и удаление</h1>
      <h2>Требования</h2>${ul(['Windows 10 или Windows 11, 64-разрядная (x64).', 'Около 350 МБ свободного места на диске.', 'Права администратора не нужны: программа устанавливается для текущего пользователя.', 'Интернет не требуется; дополнительных компонентов (Python, .NET, браузера) устанавливать не нужно — всё необходимое входит в программу.'])}
      <h2>Установка</h2><ol><li>Запустите <code>RVS-Setup-2.0.0-x64.exe</code>.</li><li>Если Windows показывает «Система Windows защитила ваш компьютер» (программа не подписана цифровым сертификатом), нажмите «Подробнее» → «Выполнить в любом случае».</li><li>Выберите папку установки (по умолчанию <code>%LOCALAPPDATA%\\Programs\\RVS</code>) и нажмите «Установить».</li><li>Программа создаст ярлыки на рабочем столе и в меню «Пуск» и свяжет файлы <code>.rvsproj</code> с программой.</li></ol>
      <h2>Портативная версия</h2><p>Архив <code>RVS-portable-x64.zip</code> распакуйте в любую папку (в том числе на флеш-накопитель) и запустите <code>RVS.exe</code>. Настройки и автосохранения портативной версии хранятся в папке «Данные» рядом с программой.</p>
      <h2>Обновление</h2><p>Запустите установщик новой версии — он заменит файлы программы. Проекты, настройки и список последних проектов сохраняются. При обновлении с версии 1.x установщик удаляет и установленный ранее расчётный модуль OpenFOAM (это файлы программы, в версии 2.0.0 он не используется).</p>
      <h2>Удаление</h2><p>«Параметры Windows → Приложения → Расчёт резервуаров РВС → Удалить» или ярлык «Удалить» в меню «Пуск». Проекты и папка данных программы не удаляются.</p>`;

  function geom() {
    return `<h1>3. Геометрия резервуара</h1><p>Геометрия задаётся в «Исходные данные → Продукт и резервуар», «Стенка и материал», «Изоляция и конструкции». Используется расчётом стенки, нагрузками, устойчивостью и модулем «Конструкции и проверки».</p>

      <h2>Требования к данным</h2>${ul(['H_ст должна равняться n·h: пояса считаются одинаковой высоты, z_i = (i − 1)·h.', 'Толщины поясов — снизу вверх: одно число (для всех) или список через «;», например «12; 12; 11; 11; 10; 10; 10; 10». Количество чисел = числу поясов.', 'Кольца жёсткости задаются высотой от днища, м; кольцо вне 0…H_ст не учитывается.', 'D — внутренний диаметр стенки.'].map(H))}
      <h2>Расчётная схема</h2>${scheme(root.SCH.geometry(ex()), 'Геометрия резервуара')}`;

  function schemesDoc() {
    const P = root.SCH.PAL.light;
    const sw = (c, k) => k === 'fill' ? `<span class="sw" style="background:${c}"></span>` : `<span class="sw ln" style="border-color:${c}"></span>`;
    return `<h1>5. Расчётные схемы</h1><p>Схемы строятся программно (SVG) из тех же величин, что формулы и таблицы. В решении они расположены перед формулами соответствующего раздела; в «Конструкциях и проверках» — рядом с результатами. Кнопка «Увеличить» открывает схему на весь экран.</p>
      <h2>Условные обозначения</h2>${tbl(['Знак', 'Смысл'], [[sw(P.inner), 'внутренние воздействия: давление жидкости и газа на стенку (направлено изнутри наружу), вертикальные силы от веса, сжатие σ_1'], [sw(P.test), 'гидроиспытания (вода)'], [sw(P.ext), 'внешние воздействия: ветер, снег, вакуум; опрокидывающий момент'], [sw(P.grav), 'собственный вес, ускорение g'], [sw(P.react), 'закрепления и граничные условия'], [sw(P.ring), 'кольца жёсткости; выделенный пояс; уровни x_i'], [sw(P.liquid, 'fill'), 'жидкость'], [sw(P.ok), 'проверка выполнена'], [sw(P.bad), 'проверка не выполнена']].map(r => [r[0], H(r[1].replace(/_([0-9a-z]+)/g, '_{$1}'))]))}
      <h2>Правила построения</h2>${ul(['Высоты, диаметры и уровни — в масштабе по введённым данным; толщины стенки — условно (утолщены для видимости), что указано в легенде.', 'Эпюры давления: ширина пропорциональна значению, масштаб условный; подписанные значения — точные, с той же точностью, что в таблицах.', 'Стрелки показывают направление и место приложения нагрузок.', 'Если расчёт не выполнен или данных не хватает, вместо схемы выводится сообщение о том, что нужно ввести; фиктивные значения не показываются.', 'Схема — пояснение к расчёту, а не результат моделирования: формы потери устойчивости и поля напряжений не изображаются.'])}
      <h2>Связь схемы с данными</h2><p>Схема не хранит собственных данных: она перестраивается при каждом пересчёте из объекта результатов расчёта (исходные данные → ядро → схема). В «Исходных данных» схема геометрии обновляется сразу при изменении поля (по введённым, ещё не применённым значениям); в «Решении» и «Результатах» — после «Применить и пересчитать»</p>`;
  }
  function resDoc() {

<script>
/* Word-отчёт без внешних библиотек: ZIP (store) + WordprocessingML. Строится только из res — те же числа, что в интерфейсе. */
(function (root) {

  const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  function setField(k, el) {
    const st = stOf(); let v;
    if (el.type === 'checkbox') v = el.checked; else if (el.tagName === 'SELECT') { v = el.value; if (k === 'ov.d') v = +v; } else if (el.type === 'date' || el.tagName === 'TEXTAREA') v = el.value; else { v = num(el.value); if (v !== null && !isFinite(v)) { C.toast('Не число: ' + el.value, true); return false; } }
    if (isNum(v) && v < 0 && !/suct|Fwvr|Mwr/.test(k)) { C.toast('Значение не может быть отрицательным', true); return false; }
    if (k === 'sig.step' && !(v > 0.05)) { C.toast('Шаг должен быть больше 0,05 м', true); return false; }
    if (k === 'cor.prot' && isNum(v) && v > 1) { C.toast('Доля скорости под покрытием — от 0 до 1', true); return false; }
    setP(st, k, v); cache = null; return true;
  }
  function change(el) {
    const a = el.dataset.st; if (!a) return false; const st = stOf();
    if (a === 'f') { if (setField(el.dataset.k, el)) C.rerender(); return true; }
    if (a === 'eq') { const e = st.eq[+el.dataset.i]; if (!e) return true; const k = el.dataset.k; e[k] = k === 'm' ? num(el.value) : el.value; cache = null; C.rerender(); return true; }
    return false;
  }

  /* ---------- события ---------- */
  async function click(t) {
    const a = t.dataset.prj; if (!a) return false;
    if (a === 'new') { newProject(); return true; }
    if (a === 'web-restore') { const e = WEB.auto(); if (e && await guard()) { await WEB.openEntry(e); WEB.del('rvs-web-autosave'); C.toast('Восстановлен проект из автосохранения — сохраните его'); } return true; }
    if (a === 'web-drop') { WEB.del('rvs-web-autosave'); C.rerender(); return true; }
    if (a === 'web-open') { const e = WEB.saved()[+t.dataset.i]; if (e && await guard()) await WEB.openEntry(e); return true; }
    if (a === 'open') { open(); return true; }
    if (a === 'open-path') { open(t.dataset.p); return true; }
    if (a === 'open-copy') { open(t.dataset.p, { asCopy: true }); return true; }
    if (a === 'example') { openExample(); return true; }
    if (a === 'save') { save(false); return true; }
    if (a === 'save-as') { save(true); return true; }
    if (a === 'restore') { restoreAutosave(t.dataset.id); return true; }
    if (a === 'drop-auto') { await D.discardAutosave(t.dataset.id); autosaves = await D.listAutosaves(); C.rerender(); return true; }
    if (a === 'forget') { await D.removeRecent(t.dataset.p); recent = await D.listRecent(); C.rerender(); return true; }
    if (a === 'show-folder') { if (path) D.showItem(path); return true; }
    if (a === 'show-backups') { if (!(path && await D.openBackupsFolder(path))) C.toast('Резервных копий пока нет'); return true; }
    if (a === 'manual-pdf') { manualPdf(); return true; }
    if (a === 'rep-pdf') { reportPdf(); return true; }
    if (a === 'step') { step = Math.max(0, Math.min(STEPS.length - 1, +t.dataset.i)); C.rerender(); const m = document.getElementById('main'); if (m) m.scrollTop = 0; return true; }
    if (a === 'gost') { C.fillGost(); return true; }
    if (a === 'coef') { const v = C.draft().v; COEF.forEach(k => { if (isEmpty(v[k])) v[k] = FMAP[k].ex; }); C.recalc(); C.toast('Подставлены типовые коэффициенты СП 20.13330 (помечены как допущения)'); return true; }
    if (a === 'calc' || a === 'calc-rep') { C.recalc(); if (C.res().ok) { C.go(a === 'calc' ? 'start' : 'rep'); C.toast('Расчёт выполнен'); } return true; }
    if (a === 'choose-dir') { const d = await D.chooseFolder({ title: 'Папка проектов по умолчанию', defaultPath: settings().projectsDir }); if (d) await setSetting({ projectsDir: d }); return true; }
    if (a === 'reset-set') { S = await D.resetSettings(); C.rerender(); C.toast('Настройки сброшены'); return true; }
    return false;
  }
  function change(el) {
    if (el.id === 'prj-file') { if (el.files && el.files[0]) openBrowserFile(el.files[0]); return true; }
    const a = el.dataset && el.dataset.prj; if (!a) return false;
    if (a === 'name') { proj.meta.name = el.value.trim() || 'Новый проект'; metaDirty = true; refresh(); return true; }
    if (a === 'author') { proj.meta.author = el.value.trim(); metaDirty = true; refresh(); return true; }

    if (a === 'theme') { C.setTheme(el.value); return true; }
    return false;

<script>

  // «a.b.c» — поле; «noz.list@ID» — элемент массива с id; «noz.list@ID.z» — поле элемента

<script>
/* Кнопка «≈ Заполнить приблизительными данными» для «Конструкций и проверок» (с 1.4.0): панель на страницах модуля, окно со списком
   значений и обоснованием, пометки «≈» у полей, баннер «результат демонстрационный», подтверждение и отмена, пометки в отчётах Word/PDF.
   Модуль «Конструкции и проверки» не изменяется: подключение через обёртку его функции отчёта, события — собственным обработчиком щелчков [data-ax]. */
(function (root) {

  function ensureOn(mod, d) { if (mod === 'st' && root.ST) root.ST.get(d); }

    return h;
  }
