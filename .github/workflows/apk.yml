name: Android APK

on:
  push:
    branches: [main]
    paths: [index.html, '*.jpg', package.json, capacitor.config.json, .github/workflows/apk.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Зависимости
        run: npm install --no-audit --no-fund
      - name: Веб-часть
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png www/
          cp *.jpg www/
      - name: Проект Android
        run: npx cap add android && npx cap sync android
      - name: Иконка приложения
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          src = Image.open('icon-512.png').convert('RGBA')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for d, n in sizes.items():
              p = f'android/app/src/main/res/mipmap-{d}'
              os.makedirs(p, exist_ok=True)
              im = src.resize((n, n), Image.LANCZOS)
              for name in ('ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png'):
                  im.save(os.path.join(p, name))
          for f in glob.glob('android/app/src/main/res/mipmap-anydpi-v26/*.xml'):
              os.remove(f)
          PY
      - name: Сборка APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../RVS-2.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RVS-2.0.0-apk
          path: RVS-2.0.0.apk
      - name: Релиз v2.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.0.0 >/dev/null 2>&1 || gh release create v2.0.0 --title "РВС 2.0.0" --notes "Приложение «Расчёт резервуаров РВС» 2.0.0 для Android. Установка: скачайте RVS-2.0.0.apk на телефон и разрешите установку из этого источника."
          gh release upload v2.0.0 RVS-2.0.0.apk --clobber
